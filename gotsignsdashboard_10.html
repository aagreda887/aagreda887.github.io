<style>
  * { box-sizing: border-box; }
  html, body {
    margin:0; padding:0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:#eef1f4; color:#13233a;
  }
  .ti { font-family: 'tabler-icons' !important; font-style: normal; }
  .no-iconfont .ti { display:none; }
  button { cursor:pointer; font-family: inherit; }
  input[type="number"], input[type="text"], select {
    font-size:13px; padding:7px 9px; border-radius:6px; border:1px solid #d8dee5; background:#fff; color:#13233a; font-family: inherit;
  }
  :focus-visible{ outline:2px solid #1b62c4; outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }

  #ds-savewarning { display:none; background:#fdf0cd; color:#5b4007; font-size:12px; padding:8px 14px; text-align:center; }

  #ds-app { display:flex; min-height:100vh; background:#f4f6f8; padding-top:env(safe-area-inset-top); padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right); }
  #ds-sidebar { width:200px; flex:0 0 200px; background:#10243f; color:#cdd9e8; padding:1.25rem 0; }

   ============================================================ */
function loadDB(){
  var seeded = lsGet("seeded_v1", null);
  if (!seeded){
    DB = sampleData();
    persist("items"); persist("vendors"); persist("itemVendors"); persist("pos"); persist("poLines"); persist("purchasedItems"); persist("receivedItems"); persist("catalogedItemIds"); persist("priceChanges");
    lsSet("seeded_v1", true);
  } else {
    DB.items = lsGet("items", []);
    DB.vendors = lsGet("vendors", []);
    DB.itemVendors = lsGet("itemVendors", []);
    DB.pos = lsGet("pos", []);
    DB.poLines = lsGet("poLines", []);
    DB.purchasedItems = lsGet("purchasedItems", []);
    DB.receivedItems = lsGet("receivedItems", []);
    DB.catalogedItemIds = lsGet("catalogedItemIds", []);
    DB.priceChanges = lsGet("priceChanges", []);
    backfillOrderData();
  }
}
function backfillOrderData(){
  var changed = false, vendorsChanged = false;
  DB.vendors.forEach(function(v){
    if (v.contactName == null){ v.contactName = ""; vendorsChanged = true; }
  });
  DB.pos.forEach(function(po){
    if (po.orderNumber == null){ po.orderNumber = nextOrderNumber(); changed = true; }
  });
  DB.poLines.forEach(function(line){
    if (!line.name){
      var it = itemById(line.itemId);
      if (it){ line.name = it.name; changed = true; }
    }
  });
  if (changed){ persist("pos"); persist("poLines"); }
  if (vendorsChanged){ persist("vendors"); }
}
function persist(part){
  if (part==="items") lsSet("items", DB.items);
  if (part==="vendors") lsSet("vendors", DB.vendors);
  if (part==="itemVendors") lsSet("itemVendors", DB.itemVendors);
  if (part==="pos") lsSet("pos", DB.pos);
  if (part==="poLines") lsSet("poLines", DB.poLines);
  if (part==="purchasedItems") lsSet("purchasedItems", DB.purchasedItems);
  if (part==="receivedItems") lsSet("receivedItems", DB.receivedItems);
  if (part==="catalogedItemIds") lsSet("catalogedItemIds", DB.catalogedItemIds);
  if (part==="priceChanges") lsSet("priceChanges", DB.priceChanges);
}

/* ============================================================
   HELPERS
   ============================================================ */
function itemById(id){ return DB.items.find(function(i){return i.id===id;}); }
function vendorById(id){ return DB.vendors.find(function(v){return v.id===id;}); }
function vendorsForItem(itemId){
  return DB.itemVendors.filter(function(iv){return iv.itemId===itemId;}).map(function(iv){
    var v = vendorById(iv.vendorId);
    return {vendorId: iv.vendorId, vendorName: v?v.name:"Unknown", website: v?v.website:"", price: iv.price};
  }).sort(function(a,b){return a.price-b.price;});
}
function fmt$(n){ return "$" + (Math.round(n*100)/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>]/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];}); }
function escapeAttr(s){ return escapeHtml(s).replace(/"/g,"&quot;"); }

function stockStatus(it){
  if (it.qty <= it.reorder) return "low";
  if (it.qty <= it.reorder + Math.max(1, Math.round((it.par-it.reorder)*0.4))) return "warning";
  return "optimal";
}
function statusRank(s){ return s==="low"?0:(s==="warning"?1:2); }
function badgeForStatus(s){
  if (s==="low") return '<span class="ds-badge ds-badge-low">Low</span>';
  if (s==="warning") return '<span class="ds-badge ds-badge-warning">Warning</span>';
  return '<span class="ds-badge ds-badge-optimal">Optimal</span>';
}
function dotForStatus(s){
  var cls = s==="low"?"ds-dot-low":(s==="warning"?"ds-dot-warning":"ds-dot-optimal");
  return '<span class="ds-dot '+cls+'" aria-hidden="true"></span>';
}
function needed(it){ return Math.max(0, it.par - it.qty); }

function sortByUrgency(list){
  return list.slice().sort(function(a,b){
    var ra = statusRank(stockStatus(a)), rb = statusRank(stockStatus(b));
    if (ra!==rb) return ra-rb;
    var da = a.qty - a.reorder, db = b.qty - b.reorder;
    if (da!==db) return da-db;
    return a.name.localeCompare(b.name);
  });
}
function countByStatus(list, s){ return list.filter(function(it){ return stockStatus(it)===s; }).length; }

/* Reorder-tab sort helpers */
function lastPurchasedDateForItem(itemId){
  var latest = null;
  DB.purchasedItems.forEach(function(p){ if (p.itemId===itemId && p.purchasedDate && (!latest || p.purchasedDate>latest)) latest = p.purchasedDate; });
  DB.receivedItems.forEach(function(r){ if (r.itemId===itemId && r.purchasedDate && (!latest || r.purchasedDate>latest)) latest = r.purchasedDate; });
  return latest;
}
function purchaseFrequencyForItem(itemId){
  var n = 0;
  DB.purchasedItems.forEach(function(p){ if (p.itemId===itemId) n++; });
  DB.receivedItems.forEach(function(r){ if (r.itemId===itemId) n++; });
  return n;
}
function latestPriceChangeForItem(itemId){
  var changes = DB.priceChanges.filter(function(c){ return c.itemId===itemId; });
  if (!changes.length) return null;
  changes = changes.slice().sort(function(a,b){ return (a.date||"").localeCompare(b.date||""); });
  return changes[changes.length-1];
}

function todayStr(){ var d=new Date(); return d.toISOString().slice(0,10); }
function fmtDate(s){
  if (!s) return "\u2014";
  var d = new Date(s+"T00:00:00");
  if (isNaN(d.getTime())) return s;
  var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return d.getDate()+" "+months[d.getMonth()]+" "+d.getFullYear();
}
function poById(id){ return DB.pos.find(function(p){return p.id===id;}); }
function linesForPO(id){ return DB.poLines.filter(function(l){return l.poId===id;}); }

/* An item is "committed" to an open order if it has a line that isn't yet
   confirmed received, on a PO that hasn't been cancelled — whether that PO
   is still awaiting purchase ("created") or is a leftover unpurchased order
   ("unpurchased"). Committed items are skipped when generating new purchase
   orders from the Catalog, so nothing gets ordered twice. */
function committedItemIds(){
  var set = {};
  DB.poLines.forEach(function(l){
    var po = poById(l.poId);
    if (po && (po.status==="created" || po.status==="unpurchased")) set[l.itemId] = true;
  });
  return set;
}

function nextOrderNumber(){
  var n = lsGet("orderCounter", 1000) + 1;
  lsSet("orderCounter", n);
  return n;
}

/* Toggles an item's "verified today" checkbox on the Catalog tab — the user
   is confirming they've physically counted it and the on-hand number shown
   is correct. This is a manual check, not tied to editing the quantity, so
   nothing gets swept into a purchase order without the user explicitly
   signing off on the count first. */
function toggleCatalogVerified(itemId, verified){
  var idx = DB.catalogedItemIds.indexOf(itemId);
  if (verified && idx===-1){
    DB.catalogedItemIds.push(itemId);
    persist("catalogedItemIds");
  } else if (!verified && idx>-1){
    DB.catalogedItemIds.splice(idx,1);
    persist("catalogedItemIds");
  }
}

/* Turns every currently-verified item that still needs restocking into
   purchase order lines, grouped by cheapest vendor, merging into an existing
   "created" PO for that vendor if one exists, or creating a new one. A
   verified item that's already fully stocked (needed(it)===0) is simply
   skipped — checking the box confirms the count, it doesn't force an order.
   Items already committed to another open order are skipped (no duplicate
   ordering); items with no vendor pricing on file still get added, grouped
   into a shared order so the user can assign one. Clears the verified list
   afterward either way, since this is a snapshot of today's count. */
function createPurchaseOrderFromCatalog(){
  var ids = DB.catalogedItemIds.slice();
  if (!ids.length){
    alert("No items have been checked off yet. Count an item on the Catalog tab and check its box to confirm the number, then try again.");
    return;
  }
  var committed = committedItemIds();
  var addedCount = 0;
  var addedNoVendor = [];
  var skippedStocked = 0;
  ids.forEach(function(itemId){
    var it = itemById(itemId);
    if (!it) return;
    if (needed(it)<=0){ skippedStocked++; return; }
    if (committed[itemId]) return;
    var vs = vendorsForItem(it.id);
    var vendorId, linePrice;
    if (vs.length){
      var cheapest = vs[0];
      vendorId = cheapest.vendorId;
      linePrice = cheapest.price;
    } else {
      /* No vendor priced this item on file yet. Rather than skip it, group it
         into a shared "vendor not yet assigned" order with a blank price —
         so it still reaches a purchase order. The user assigns a real vendor
         and price right there on the Purchase Orders tab, the same way any
         other line is edited. */
      vendorId = null;
      linePrice = null;
      addedNoVendor.push(it.name);
    }
    var openPO = DB.pos.find(function(p){ return p.status==="created" && p.vendorId===vendorId; });
    if (!openPO){
      openPO = {id: uid("po"), vendorId: vendorId, orderNumber: nextOrderNumber(), status:"created", createdDate: todayStr(), purchasedDate:""};
      DB.pos.push(openPO);
    }
    DB.poLines.push({id: uid("pl"), poId: openPO.id, itemId: it.id, name: it.name, qty: needed(it), price: linePrice, purchased: false, purchasedOnDate: null});
    addedCount++;
  });
  DB.catalogedItemIds = [];
  persist("pos"); persist("poLines"); persist("catalogedItemIds");
  if (addedCount){
    state.tab = "purchaseOrders";
    render();
  } else {
    render();
  }
  if (addedCount || addedNoVendor.length){
    var msg = addedCount ? (addedCount+" item"+(addedCount===1?"":"s")+" added to purchase orders.") : "None of the checked items needed a purchase order.";
    if (addedNoVendor.length) msg += "\n\n"+addedNoVendor.length+" item"+(addedNoVendor.length===1?"":"s")+" ("+addedNoVendor.join(", ")+") had no vendor on file yet — "+(addedNoVendor.length===1?"it was":"they were")+" grouped into its own order so you can assign a supplier and price on the Purchase Orders tab.";
    if (skippedStocked) msg += "\n\n"+skippedStocked+" checked item"+(skippedStocked===1?"":"s")+" "+(skippedStocked===1?"was":"were")+" already fully stocked and didn’t need an order.";
    alert(msg);
  } else if (skippedStocked){
    alert("All "+skippedStocked+" checked item"+(skippedStocked===1?"":"s")+" "+(skippedStocked===1?"was":"were")+" already fully stocked — nothing needed to be ordered.");
  }
}

/* Adds qty of an item onto a specific purchase order. If that item already has
   a line on this order, the quantities are combined instead of creating a
   second row for the same item. priceIfNew only applies when a new line is
   created — an existing line's price is left exactly as it was. */
function addOrBumpPOLine(poId, itemId, qty, priceIfNew){
  var existing = DB.poLines.find(function(l){ return l.poId===poId && l.itemId===itemId; });
  if (existing){
    existing.qty = existing.qty + qty;
  } else {
    var it = itemById(itemId);
    DB.poLines.push({id: uid("pl"), poId: poId, itemId: itemId, name: it?it.name:"", qty: qty, price: priceIfNew, purchased: false, purchasedOnDate: null});
  }
  persist("poLines");
}

/* Reorder tab's "Add to Purchase Order" button: finds this item's cheapest
   vendor (same rule the Catalog → Create Purchase Order flow uses) and drops
   it onto that vendor's already-open "created" order, or starts a new one.
   Items with no vendor priced on file yet fall into the same shared
   "no vendor assigned yet" order that Catalog uses for the same case. */
function addItemToPurchaseOrder(itemId){
  var it = itemById(itemId);
  if (!it) return;
  var vs = vendorsForItem(it.id);
  var vendorId, linePrice;
  if (vs.length){
    var cheapest = vs[0];
    vendorId = cheapest.vendorId;
    linePrice = cheapest.price;
  } else {
    vendorId = null;
    linePrice = null;
  }
  var openPO = DB.pos.find(function(p){ return p.status==="created" && p.vendorId===vendorId; });
  if (!openPO){
    openPO = {id: uid("po"), vendorId: vendorId, orderNumber: nextOrderNumber(), status:"created", createdDate: todayStr(), purchasedDate:""};
    DB.pos.push(openPO);
  }
  addOrBumpPOLine(openPO.id, it.id, Math.max(1, needed(it)), linePrice);
  persist("pos");
  render();
}

/* Completing a purchase order splits its lines in two: items checked off as
   "Purchased" move into the Orders Placed ledger (dated today), while any
   unchecked items stay on the same order but the order itself flips to
   status "unpurchased" so it now lives on the Recommended Orders tab, still
   editable, still awaiting purchase. If every line was checked off, the
   order is fully consumed and removed. */
function completePurchaseOrder(poId){
  var po = poById(poId);
  if (!po) return;
  var lines = linesForPO(poId);
  var purchasedLines = lines.filter(function(l){ return !!l.purchased; });
  if (!purchasedLines.length){
    alert("Check off at least one item as “Purchased” before completing this order.");
    return;
  }
  var remainingCount = lines.length - purchasedLines.length;
  if (!confirm("Complete this purchase order? "+purchasedLines.length+" item"+(purchasedLines.length===1?"":"s")+" will move to Orders Placed."+(remainingCount ? " The remaining "+remainingCount+" item"+(remainingCount===1?"":"s")+" will move to Recommended Orders." : ""))) return;

  var today = todayStr();
  purchasedLines.forEach(function(l){
    var it = itemById(l.itemId);
    DB.purchasedItems.push({
      id: uid("pi"),
      orderNumber: po.orderNumber,
      vendorId: po.vendorId,
      itemId: l.itemId,
      itemName: it ? it.name : (l.name || "Unknown item"),
      qty: l.qty,
      price: l.price,
      /* Use the date the line was actually checked "Purchased," not the date
         this order happens to be completed — falls back to today only if
         that stamp is somehow missing. */
      purchasedDate: l.purchasedOnDate || today
    });
  });
  var purchasedIds = {};
  purchasedLines.forEach(function(l){ purchasedIds[l.id] = true; });
  DB.poLines = DB.poLines.filter(function(l){ return !purchasedIds[l.id]; });

  if (linesForPO(poId).length){
    po.status = "unpurchased";
  } else {
    DB.pos = DB.pos.filter(function(p){ return p.id!==poId; });
  }
  persist("pos"); persist("poLines"); persist("purchasedItems");
  render();
}

/* Moves a PO line to a different vendor's "created" order (creating one if
   needed), since a purchase order is always for a single vendor. Cleans up
   the old order if it's left empty. */
function moveLineToVendor(lineId, vendorId){
  var line = DB.poLines.find(function(l){return l.id===lineId;});
  if (!line) return;
  var oldPO = poById(line.poId);
  if (!oldPO || oldPO.vendorId===vendorId) return;
  var targetPO = DB.pos.find(function(p){ return p.status==="created" && p.vendorId===vendorId; });
  if (!targetPO){
    targetPO = {id: uid("po"), vendorId: vendorId, orderNumber: nextOrderNumber(), status:"created", createdDate: todayStr(), purchasedDate:""};
    DB.pos.push(targetPO);
  }
  line.poId = targetPO.id;
  if (linesForPO(oldPO.id).length===0){
    DB.pos = DB.pos.filter(function(p){return p.id!==oldPO.id;});
  }
  persist("pos"); persist("poLines");
  render();
}
function addNewVendorAndMoveLine(lineId, name){
  var v = {id: uid("v"), name: name, website:"", contact:"", contactName:""};
  DB.vendors.push(v);
  persist("vendors");
  moveLineToVendor(lineId, v.id);
}
function removePOLine(lineId){
  if (!confirm("Remove this item from the order?")) return;
  var line = DB.poLines.find(function(l){return l.id===lineId;});
  if (!line) return;
  var poId = line.poId;
  DB.poLines = DB.poLines.filter(function(l){return l.id!==lineId;});
  if (linesForPO(poId).length===0){
    DB.pos = DB.pos.filter(function(p){return p.id!==poId;});
  }
  persist("pos"); persist("poLines");
  render();
}

function removePurchasedItem(id){
  if (!confirm("Remove this purchased record? This won't affect stock levels or the original order.")) return;
  DB.purchasedItems = DB.purchasedItems.filter(function(p){return p.id!==id;});
  persist("purchasedItems");
  render();
}
function updatePurchasedDateGroup(orderNumber, oldDate, newValue){
  DB.purchasedItems.forEach(function(p){
    if (p.orderNumber===orderNumber && p.purchasedDate===oldDate) p.purchasedDate = newValue;
  });
  persist("purchasedItems");
  render();
}

/* Correcting a PO line's price is treated as the real, current price from
   that vendor going forward — it updates (or creates) the item's vendor
   pricing record, not just this one order. */
function updateVendorPriceForLine(itemId, vendorId, newPrice){
  var iv = DB.itemVendors.find(function(x){return x.itemId===itemId && x.vendorId===vendorId;});
  if (iv){
    if (iv.price !== newPrice){
      DB.priceChanges.push({id: uid("pc"), itemId: itemId, vendorId: vendorId, oldPrice: iv.price, newPrice: newPrice, date: todayStr()});
      persist("priceChanges");
    }
    iv.price = newPrice;
  }
  else { DB.itemVendors.push({id: uid("iv"), itemId: itemId, vendorId: vendorId, price: newPrice}); }
  persist("itemVendors");
}

function cancelCreatedPO(poId){
  if (!confirm("Cancel this purchase order? It hasn't been purchased yet.")) return;
  DB.pos = DB.pos.filter(function(p){return p.id!==poId;});
  DB.poLines = DB.poLines.filter(function(l){return l.poId!==poId;});
  persist("pos"); persist("poLines");
  render();
}
function updateVendorContact(vendorId, value){
  var v = vendorById(vendorId);
  if (v){ v.contact = value; persist("vendors"); }
}

/* Checking an item "Received" on the Orders Placed tab moves it into
   Orders Received and adds its quantity to stock \u2014 the point at which it
   actually counts as inventory on the shelf. */
function markItemReceived(purchasedItemId){
  var p = DB.purchasedItems.find(function(x){return x.id===purchasedItemId;});
  if (!p) return;
  DB.purchasedItems = DB.purchasedItems.filter(function(x){return x.id!==purchasedItemId;});
  var it = itemById(p.itemId);
  if (it) it.qty += p.qty;
  DB.receivedItems.push({
    id: uid("ri"), orderNumber: p.orderNumber, vendorId: p.vendorId, itemId: p.itemId,
    itemName: p.itemName, qty: p.qty, price: p.price, purchasedDate: p.purchasedDate, receivedDate: todayStr()
  });
  persist("items"); persist("purchasedItems"); persist("receivedItems");
  render();
}
/* Checking "Received" on the Orders Placed tab no longer moves an item
   instantly — it just flags it and dims the row. "Confirm All Received"
   finalizes every checked item in that one order group: adds its qty to
   stock and moves it into Order History, keeping the original order #,
   purchase date, item, quantity and price intact. Anything left unchecked
   simply stays put for next time. */
function confirmGroupReceived(orderNumber, purchasedDate){
  var group = DB.purchasedItems.filter(function(p){
    return p.orderNumber===orderNumber && p.purchasedDate===purchasedDate && p.receivedPending;
  });
  if (!group.length){
    alert("Check off at least one item as “Received” before confirming.");
    return;
  }
  if (!confirm("Confirm "+group.length+" item"+(group.length===1?"":"s")+" received? "+(group.length===1?"It":"They")+" will move to Order History and be added to stock.")) return;
  var ids = {};
  group.forEach(function(p){ ids[p.id] = true; });
  group.forEach(function(p){
    var it = itemById(p.itemId);
    if (it) it.qty += p.qty;
    DB.receivedItems.push({
      id: uid("ri"), orderNumber: p.orderNumber, vendorId: p.vendorId, itemId: p.itemId,
      itemName: p.itemName, qty: p.qty, price: p.price, purchasedDate: p.purchasedDate, receivedDate: todayStr()
    });
  });
  DB.purchasedItems = DB.purchasedItems.filter(function(p){ return !ids[p.id]; });
  persist("items"); persist("purchasedItems"); persist("receivedItems");
  render();
}
function undoItemReceived(receivedItemId){
  var r = DB.receivedItems.find(function(x){return x.id===receivedItemId;});
  if (!r) return;
  DB.receivedItems = DB.receivedItems.filter(function(x){return x.id!==receivedItemId;});
  var it = itemById(r.itemId);
  if (it) it.qty = Math.max(0, it.qty - r.qty);
  DB.purchasedItems.push({
    id: uid("pi"), orderNumber: r.orderNumber, vendorId: r.vendorId, itemId: r.itemId,
    itemName: r.itemName, qty: r.qty, price: r.price, purchasedDate: r.purchasedDate
  });
  persist("items"); persist("purchasedItems"); persist("receivedItems");
  render();
}

/* An item counts as "missing" once at least one other item from the same
   original order has already been received, while this one is still sitting
   unreceived in Orders Placed \u2014 i.e. a short/partial shipment. */
function computeMissingLines(){
  var receivedGroupKeys = {};
  DB.receivedItems.forEach(function(r){ receivedGroupKeys[r.orderNumber+"|"+r.purchasedDate] = true; });
  var result = [];
  DB.purchasedItems.forEach(function(p){
    if (receivedGroupKeys[p.orderNumber+"|"+p.purchasedDate]){
      result.push({ item: itemById(p.itemId), purchased: p, vendor: vendorById(p.vendorId) });
    }
  });
  return result;
}

/* ============================================================

   ============================================================ */
var isRendering = false;
function render(){
  if (isRendering) return;
  isRendering = true;
  var root = document.getElementById("ds-root");
  root.innerHTML = appShell();
  bindSidebarEvents();
  bindEvents();
  isRendering = false;
}
function renderMain(){
  if (isRendering) return;
  isRendering = true;
  var main = document.getElementById("ds-main");
  if (!main){ isRendering = false; render(); return; }
  main.innerHTML = mainContent();
  bindEvents();
  isRendering = false;
}
function bindSidebarEvents(){
  var root = document.getElementById("ds-root");
  root.querySelectorAll("[data-tab]").forEach(function(b){
    b.addEventListener("click", function(){
      var tab = b.getAttribute("data-tab");
      state.tab = tab; state.search=""; state.poEditing=null; state.supplierEditing=null; render();
    });
  });
}
function appShell(){
  return '<div id="ds-app">' + sidebarHtml() + '<div id="ds-main">' + mainContent() + '</div></div>';
}

  var html = "";

  if (missing.length){
    var names = missing.map(function(m){ return m.item ? m.item.name : "Unknown item"; });

    if (names.length>4) shown += ", and "+(names.length-4)+" more";
    html += '<div class="ds-missing-banner"><i class="ti ti-alert-triangle" aria-hidden="true"></i><div style="flex:1;"><div class="ds-missing-banner-title">'+missing.length+' item'+(missing.length===1?"":"s")+' missing from received orders</div><div class="ds-missing-banner-list">'+escapeHtml(shown)+'</div></div><a href="#" data-action="goto-missing">View missing items \u2192</a></div>';

  html += '<div style="display:flex;align-items:center;justify-content:center;gap:16px;margin-top:14px;">';
  html += '<button class="ds-btn-outline" data-action="export-data"><i class="ti ti-download" style="font-size:13px;vertical-align:-2px;margin-right:4px;" aria-hidden="true"></i>Export data</button>';

function reorderTab(){
  var sortMode = state.reorderSort || "urgency";
  var html = '<div class="ds-tabs-row">';
  [["urgency","Urgency"],["lastPurchased","Last purchased"],["frequency","Most frequently purchased"],["alpha","Alphabetical"]].forEach(function(t){
    var active = sortMode===t[0];
    html += '<button class="ds-tab-pill'+(active?' active':'')+'" data-reordersort="'+t[0]+'">'+t[1]+'</button>';
  });
  html += '</div>';

  var list = DB.items.filter(function(it){ var s = stockStatus(it); return s==="low" || s==="warning"; });
  if (sortMode==="urgency") list = sortByUrgency(list);
  else if (sortMode==="alpha") list = list.slice().sort(function(a,b){return a.name.localeCompare(b.name);});
  else if (sortMode==="lastPurchased") list = list.slice().sort(function(a,b){
    var da = lastPurchasedDateForItem(a.id) || "";
    var db = lastPurchasedDateForItem(b.id) || "";
    if (da===db) return a.name.localeCompare(b.name);
    return db.localeCompare(da);
  });
  else if (sortMode==="frequency") list = list.slice().sort(function(a,b){
    var diff = purchaseFrequencyForItem(b.id) - purchaseFrequencyForItem(a.id);
    return diff!==0 ? diff : a.name.localeCompare(b.name);
  });

  if (!list.length){
    return html + '<div class="ds-empty">Nothing needs reordering right now \u2014 everything is stocked above its reorder point.</div>';
  }
  html += '<p style="font-size:12.5px;color:#5b6b80;margin:0 0 1rem;">These items are at or below their reorder point. Pick a vendor to open their site and place the order directly, or add it straight to a purchase order.</p>';
  var committed = committedItemIds();
  list.forEach(function(it){
    var s = stockStatus(it);
    var vs = vendorsForItem(it.id);
    html += '<div class="ds-card">';
    html += '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;">';
    html += '<div><div class="ds-item-name">'+escapeHtml(it.name)+'</div>' + (it.specs?'<div class="ds-item-specs">'+escapeHtml(it.specs)+'</div>':'') + '<div style="font-size:11.5px;color:#7c8a9b;margin-top:3px;">'+CATEGORY_LABELS[it.category]+' \u00b7 '+TIERS[it.tier].label+'</div></div>';
    html += badgeForStatus(s);
    html += '</div>';
    html += '<div style="font-size:12.5px;color:#5b6b80;margin:8px 0;">On hand <b>'+it.qty+'</b> '+escapeHtml(it.unit)+(it.qty===1?'':'s')+' \u00b7 reorder at <b>'+it.reorder+'</b> \u00b7 need <b>'+needed(it)+'</b> more</div>';
    var priceChange = latestPriceChangeForItem(it.id);
    if (priceChange){
      var pcVendor = vendorById(priceChange.vendorId);
      html += '<div style="font-size:11.5px;color:#92660a;background:#fdf0cd;border-radius:5px;padding:6px 9px;margin-bottom:8px;">Price changed from '+fmt$(priceChange.oldPrice)+' to '+fmt$(priceChange.newPrice)+' on '+fmtDate(priceChange.date)+' by '+escapeHtml(pcVendor?pcVendor.name:"Unknown supplier")+'</div>';
    }
    if (!vs.length){
      html += '<div style="font-size:12px;color:#b3261e;margin-bottom:8px;">No vendor priced for this item yet.</div>';
    } else {
      html += '<div style="margin-bottom:8px;">';
      vs.forEach(function(o,idx){
        if (o.website){
          html += '<a class="ds-order-link" href="'+escapeAttr(o.website)+'" target="_blank" rel="noopener noreferrer">'+escapeHtml(o.vendorName)+' \u2014 '+fmt$(o.price)+ (idx===0?'<span class="ds-best">Best price</span>':'') +' <i class="ti ti-external-link" style="font-size:12px;" aria-hidden="true"></i></a>';
        } else {
          html += '<span class="ds-order-link" style="opacity:.6;">'+escapeHtml(o.vendorName)+' \u2014 '+fmt$(o.price)+' (no website on file)</span>';
        }
      });
      html += '</div>';
    }
    html += '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">';
    html += '<button class="ds-btn-outline" data-action="add-to-po" data-item="'+it.id+'"><i class="ti ti-file-invoice" style="font-size:13px;vertical-align:-2px;" aria-hidden="true"></i> Add to Purchase Order</button>';
    if (committed[it.id]) html += '<span style="font-size:11px;color:#7c8a9b;">Already on an open order</span>';
    html += '</div>';
    html += '</div>';
  });

function isEditingPO(field, id){ return state.poEditing && state.poEditing.field===field && state.poEditing.id===id; }
function vendorSelectHtml(lineId, currentVendorId){
  var html = '<select data-line-vendor="'+lineId+'">';
  DB.vendors.forEach(function(v){
    html += '<option value="'+v.id+'" '+(v.id===currentVendorId?"selected":"")+'>'+escapeHtml(v.name)+'</option>';
  });
  html += '<option value="__other__">+ Other (new supplier)\u2026</option>';
  html += '</select>';
  return html;
}
function purchaseOrdersTab(){ return poListTab("created"); }
function unpurchasedOrdersTab(){ return poListTab("unpurchased"); }

function poListTab(status){
  var list = DB.pos.filter(function(p){return p.status===status;});
  var html = "";

  if (status==="created"){
    var unassigned = DB.items.filter(function(it){
      var s = stockStatus(it);
      return (s==="low"||s==="warning") && !vendorsForItem(it.id).length;
    });
    if (!list.length && !unassigned.length){
      return '<div class="ds-empty">No purchase orders yet. Change quantities on the Catalog tab, then click \u201cCreate Purchase Order.\u201d</div>';
    }
    if (unassigned.length){
      html += '<div class="ds-card" style="border-left:4px solid #f2b33d;"><div class="ds-card-title">Needs a vendor</div>';
      html += '<p style="font-size:12.5px;color:#5b6b80;margin:0 0 .5rem;">These items are low but have no vendor pricing on file, so they can\u2019t be added to a purchase order yet:</p>';
      unassigned.forEach(function(it){ html += '<div style="font-size:13px;padding:3px 0;">\u2022 '+escapeHtml(it.name)+'</div>'; });
      html += '</div>';
    }
  } else if (!list.length){
    return '<div class="ds-empty">No unpurchased orders right now. When you complete a purchase order without checking off every item, the leftovers land here.</div>';
  }

  if (list.length){
    var grandTotal = 0;
    list.forEach(function(po){ linesForPO(po.id).forEach(function(l){ grandTotal += l.price*l.qty; }); });
    html += '<div class="ds-card" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">';
    html += '<div style="font-size:13px;color:#5b6b80;">'+list.length+' order'+(list.length===1?"":"s")+' waiting to be purchased</div>';
    html += '<div style="font-size:17px;font-weight:700;color:#13233a;">Grand total: '+fmt$(grandTotal)+'</div>';
    html += '</div>';
  }

  list.forEach(function(po){
    var v = vendorById(po.vendorId);
    var lines = linesForPO(po.id);
    var total = lines.reduce(function(s,l){return s+l.price*l.qty;},0);
    var purchasedCount = lines.filter(function(l){return !!l.purchased;}).length;
    html += '<div class="ds-card">';
    html += '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;">';
    html += '<div class="ds-card-title" style="margin-bottom:0;">Order #'+po.orderNumber+' \u00b7 '+escapeHtml(v?v.name:(po.vendorId===null?"No vendor assigned yet":"Unknown vendor"))+'</div>';
    html += '<div style="font-size:11.5px;color:#7c8a9b;">'+lines.length+' item'+(lines.length===1?"":"s")+' \u00b7 created '+fmtDate(po.createdDate)+'</div>';
    html += '</div>';
    if (isEditingPO("phone", po.vendorId)){
      html += '<div class="ds-tracking-row" style="margin-top:6px;"><i class="ti ti-phone" style="font-size:14px;color:#7c8a9b;" aria-hidden="true"></i><label for="pophone-'+po.id+'">Supplier phone</label><input type="text" id="pophone-'+po.id+'" data-vendor-contact="'+po.vendorId+'" value="'+escapeAttr(v?v.contact||"":"")+'" placeholder="Not on file" style="width:160px;" /></div>';
    } else {
      var phoneText = (v && v.contact) ? escapeHtml(v.contact) : "Not on file";
      var phoneCls = (v && v.contact) ? "" : " ds-placeholder";
      html += '<div class="ds-tracking-row" style="margin-top:6px;"><i class="ti ti-phone" style="font-size:14px;color:#7c8a9b;" aria-hidden="true"></i><label>Supplier phone</label><span class="ds-editable-preset'+phoneCls+'" data-action="edit-po-field" data-field="phone" data-id="'+po.vendorId+'" tabindex="0" role="button" aria-label="Edit supplier phone number">'+phoneText+'</span></div>';
    }

    lines.forEach(function(l){
      var it = itemById(l.itemId);
      html += '<tr'+(l.purchased?' style="opacity:.5;"':'')+'>';
      html += '<td><div class="ds-item-name">'+escapeHtml(it?it.name:(l.name||"Unknown item"))+'</div>' + (it&&it.specs?'<div class="ds-item-specs">'+escapeHtml(it.specs)+'</div>':'') + '</td>';
      html += '<td>'+(isEditingPO("qty",l.id)
        ? '<input type="number" min="1" step="1" data-line-qty="'+l.id+'" value="'+l.qty+'" style="width:60px;" />'

        ? '<input type="number" min="0" step="0.01" data-line-price="'+l.id+'" value="'+(l.price==null?"":l.price)+'" placeholder="Not set" style="width:80px;" />'

            : '<span class="ds-editable-preset" data-action="edit-po-field" data-field="price" data-id="'+l.id+'" tabindex="0" role="button" aria-label="Edit price">'+fmt$(l.price)+'</span>'))+'</td>';
      html += '<td>'+(isEditingPO("vendor",l.id)

      html += '<td><button data-action="remove-po-line" data-lineid="'+l.id+'" aria-label="Remove item" style="padding:4px 9px;background:#fff;border:1px solid #d8dee5;border-radius:6px;"><span aria-hidden="true" style="font-size:15px;font-weight:700;color:#b3261e;line-height:1;">\u00d7</span></button></td>';
      html += '<td style="text-align:center;"><input type="checkbox" data-action="toggle-line-purchased" data-lineid="'+l.id+'" '+(l.purchased?'checked ':'')+'aria-label="Mark '+escapeAttr(it?it.name:"item")+' as purchased" style="width:17px;height:17px;accent-color:#1b62c4;" /></td>';
      html += '</tr>';
    });
    html += '</table></div>';
    html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;flex-wrap:wrap;gap:10px;">';
    html += '<div style="font-size:14px;font-weight:700;color:#13233a;">Order total: '+fmt$(total)+'</div>';
    html += '<div style="display:flex;align-items:center;gap:8px;">';
    html += '<button class="ds-btn-outline" data-action="cancel-po" data-poid="'+po.id+'">Cancel order</button>';
    if (v && v.website) html += '<a class="ds-order-link" href="'+escapeAttr(v.website)+'" target="_blank" rel="noopener noreferrer">Visit site <i class="ti ti-external-link" style="font-size:12px;" aria-hidden="true"></i></a>';
    html += '</div></div>';
    html += '<div style="margin-top:12px;padding-top:12px;border-top:1px solid #eef1f4;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">';
    html += '<button class="ds-btn-primary" data-action="complete-po" data-poid="'+po.id+'"'+(purchasedCount?'':' disabled')+' style="'+(purchasedCount?'':'opacity:.5;cursor:default;')+'">Complete Purchase Order</button>';
    html += '<button class="ds-btn-outline" data-action="open-add-po-item" data-poid="'+po.id+'"><i class="ti ti-plus" style="font-size:13px;vertical-align:-2px;" aria-hidden="true"></i> Add item</button>';
    if (purchasedCount) html += '<span style="font-size:11.5px;color:#7c8a9b;">'+purchasedCount+' of '+lines.length+' marked purchased</span>';
    html += '</div>';
    html += '</div>';
  });
  return html;
}

/* ============================================================
   PURCHASED ORDERS TAB
   ============================================================ */
function purchasedOrdersTab(){
  if (!DB.purchasedItems.length) return '<div class="ds-empty">Nothing purchased yet. Check items off on the Purchase Orders tab and they\u2019ll show up here.</div>';

  var vendorGroups = {};
  DB.purchasedItems.forEach(function(p){
    (vendorGroups[p.vendorId] = vendorGroups[p.vendorId] || []).push(p);
  });
  var vendorIds = Object.keys(vendorGroups).sort(function(a,b){
    var va = vendorById(a), vb = vendorById(b);
    return (va?va.name:"").localeCompare(vb?vb.name:"");
  });

  var grandTotal = DB.purchasedItems.reduce(function(s,p){return s+p.qty*p.price;},0);
  var html = '<div class="ds-card" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">';
  html += '<div style="font-size:13px;color:#5b6b80;">'+DB.purchasedItems.length+' item'+(DB.purchasedItems.length===1?"":"s")+' purchased across '+vendorIds.length+' supplier'+(vendorIds.length===1?"":"s")+'</div>';
  html += '<div style="font-size:17px;font-weight:700;color:#13233a;">Total: '+fmt$(grandTotal)+'</div>';
  html += '</div>';

  vendorIds.forEach(function(vid){
    var v = vendorById(vid);
    var items = vendorGroups[vid];

    /* Items from the same original order, checked off on the same day,
       are grouped into one order block. */
    var orderGroups = {};
    items.forEach(function(p){
      var key = p.orderNumber + "|" + p.purchasedDate;
      if (!orderGroups[key]) orderGroups[key] = { orderNumber: p.orderNumber, purchasedDate: p.purchasedDate, items: [] };
      orderGroups[key].items.push(p);
    });
    var orderKeys = Object.keys(orderGroups).sort(function(a,b){
      return (orderGroups[b].purchasedDate||"").localeCompare(orderGroups[a].purchasedDate||"");
    });
    var vendorTotal = items.reduce(function(s,p){return s+p.qty*p.price;},0);

    html += '<div class="ds-card">';
    html += '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;">';
    html += '<div class="ds-card-title" style="margin-bottom:0;">'+escapeHtml(v?v.name:"Unknown vendor")+'</div>';
    html += '<div style="font-size:11.5px;color:#7c8a9b;">'+items.length+' item'+(items.length===1?"":"s")+' \u00b7 '+orderKeys.length+' order'+(orderKeys.length===1?"":"s")+'</div>';
    html += '</div>';

    orderKeys.forEach(function(key, idx){
      var grp = orderGroups[key];
      var subtotal = grp.items.reduce(function(s,p){return s+p.qty*p.price;},0);
      html += '<div style="margin-top:'+(idx===0?"10px":"16px")+';padding-top:'+(idx===0?"0":"14px")+';'+(idx===0?"":"border-top:1px solid #eef1f4;")+'">';
      html += '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px;">';
      html += '<div style="font-size:12.5px;font-weight:700;color:#13233a;">Order #'+grp.orderNumber+'</div>';
      html += '<label style="font-size:11px;color:#7c8a9b;">Purchased <input type="date" data-group-order="'+grp.orderNumber+'" data-group-olddate="'+escapeAttr(grp.purchasedDate||"")+'" value="'+escapeAttr(grp.purchasedDate||"")+'" style="width:140px;" /></label>';
      html += '</div>';
      var pendingCount = grp.items.filter(function(p){return !!p.receivedPending;}).length;
      html += '<div style="overflow-x:auto;"><table class="ds-table"><tr><th>Qty</th><th>Item</th><th>Total price paid</th><th></th><th>Received</th></tr>';
      grp.items.forEach(function(p){
        html += '<tr'+(p.receivedPending?' style="opacity:.5;"':'')+'>';
        html += '<td>'+p.qty+'</td>';
        html += '<td><div class="ds-item-name">'+escapeHtml(p.itemName)+'</div></td>';
        html += '<td>'+fmt$(p.qty*p.price)+'</td>';
        html += '<td><button data-action="remove-purchased-item" data-id="'+p.id+'" aria-label="Remove this purchased record" style="padding:4px 9px;background:#fff;border:1px solid #d8dee5;border-radius:6px;"><span aria-hidden="true" style="font-size:15px;font-weight:700;color:#b3261e;line-height:1;">\u00d7</span></button></td>';
        html += '<td style="text-align:center;"><input type="checkbox" data-action="toggle-item-received" data-id="'+p.id+'" '+(p.receivedPending?'checked ':'')+'aria-label="Mark '+escapeAttr(p.itemName)+' as received" style="width:17px;height:17px;accent-color:#1b62c4;" /></td>';
        html += '</tr>';
      });
      html += '</table></div>';
      html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;flex-wrap:wrap;gap:10px;">';
      html += '<div><button class="ds-btn-primary" data-action="confirm-group-received" data-order-number="'+grp.orderNumber+'" data-order-date="'+escapeAttr(grp.purchasedDate||"")+'"'+(pendingCount?'':' disabled')+' style="'+(pendingCount?'':'opacity:.5;cursor:default;')+'">Confirm All Received</button>';
      if (pendingCount) html += ' <span style="font-size:11.5px;color:#7c8a9b;">'+pendingCount+' of '+grp.items.length+' checked</span>';
      html += '</div>';
      html += '<div style="text-align:right;font-size:12.5px;color:#5b6b80;">Order subtotal: '+fmt$(subtotal)+'</div>';
      html += '</div>';
      html += '</div>';
    });

    html += '<div style="text-align:right;font-size:13px;font-weight:700;color:#13233a;margin-top:14px;padding-top:10px;border-top:1px solid #e3e7ec;">Supplier total: '+fmt$(vendorTotal)+'</div>';
    html += '</div>';
  });
  return html;
}

function daysAgoStr(days){
  var d = new Date();
  d.setDate(d.getDate() - days);
  return d.toISOString().slice(0,10);
}
function orderHistoryTab(){
  var html = '<div class="ds-tabs-row">';
  [["all","All time"],["week","Last week"],["month","Past month"],["90days","Last 90 days"],["year","Last year"]].forEach(function(t){
    var active = state.historyDateRange===t[0];
    html += '<button class="ds-tab-pill'+(active?' active':'')+'" data-historyrange="'+t[0]+'">'+t[1]+'</button>';
  });
  html += '</div>';

  html += '<div class="ds-tabs-row">';
  var catPills = [["all","All categories"]];
  CATEGORY_ORDER.forEach(function(k){ catPills.push([k, CATEGORY_LABELS[k]]); });

    var active = state.historyCategory===t[0];

  html += '<div style="margin-bottom:1.1rem;"><select data-historysupplier style="font-size:13px;"><option value="all">All suppliers</option>';

    html += '<option value="'+v.id+'" '+(state.historySupplier===v.id?"selected":"")+'>'+escapeHtml(v.name)+'</option>';
  });
  html += '</select></div>';

  var list = DB.receivedItems.slice();
  if (state.historyDateRange!=="all"){
    var cutoff = daysAgoStr(state.historyDateRange==="week"?7 : state.historyDateRange==="month"?30 : state.historyDateRange==="90days"?90 : 365);
    list = list.filter(function(r){ return (r.purchasedDate||"") >= cutoff; });

    list = list.filter(function(r){ var it = itemById(r.itemId); return it && it.category===state.historyCategory; });

    list = list.filter(function(r){ return r.vendorId===state.historySupplier; });

  var grandTotal = list.reduce(function(s,r){return s+r.qty*r.price;},0);

  html += '<div style="font-size:17px;font-weight:700;color:#13233a;">Total: '+fmt$(grandTotal)+'</div>';
  html += '</div>';

  var vendorGroups = {};
  list.forEach(function(r){ (vendorGroups[r.vendorId] = vendorGroups[r.vendorId] || []).push(r); });
  var vendorIds = Object.keys(vendorGroups).sort(function(a,b){
    var va = vendorById(a), vb = vendorById(b);
    return (va?va.name:"").localeCompare(vb?vb.name:"");
  });

  vendorIds.forEach(function(vid){
    var v = vendorById(vid);
    var items = vendorGroups[vid];
    var orderGroups = {};
    items.forEach(function(r){
      var key = r.orderNumber + "|" + r.purchasedDate;
      if (!orderGroups[key]) orderGroups[key] = { orderNumber: r.orderNumber, purchasedDate: r.purchasedDate, items: [] };
      orderGroups[key].items.push(r);
    });
    var orderKeys = Object.keys(orderGroups).sort(function(a,b){
      return (orderGroups[b].purchasedDate||"").localeCompare(orderGroups[a].purchasedDate||"");
    });
    var vendorTotal = items.reduce(function(s,r){return s+r.qty*r.price;},0);

    html += '<div class="ds-card">';
    html += '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;">';
    html += '<div class="ds-card-title" style="margin-bottom:0;">'+escapeHtml(v?v.name:"Unknown vendor")+'</div>';

      html += '<div style="overflow-x:auto;"><table class="ds-table"><tr><th>Order #</th><th>Qty</th><th>Item</th><th>Total paid</th><th>Received</th><th></th></tr>';
      grp.items.forEach(function(r){

      html += '</div>';

    html += '</div>';
  });
  return html;

function supplierDetailPanel(){

  html += '<div class="ds-card" style="margin-bottom:1.25rem;">';
  html += '<div style="font-size:24px;font-weight:800;color:#13233a;margin-bottom:8px;">'+escapeHtml(v.name)+'</div>';

  html += '<div><i class="ti ti-world" style="margin-right:5px;" aria-hidden="true"></i>'+(v.website?'<a href="'+escapeAttr(v.website)+'" target="_blank" rel="noopener noreferrer">'+escapeHtml(v.website)+' <i class="ti ti-external-link" style="font-size:11px;" aria-hidden="true"></i></a>':'No website on file')+'</div>';
  html += '<div><i class="ti ti-phone" style="margin-right:5px;" aria-hidden="true"></i>'+(v.contact?escapeHtml(v.contact):'No phone on file')+'</div>';
  html += '</div></div>';

  var orderGroups = {};
  function addRecord(orderNumber, purchasedDate, itemName, qty, price, status){
    if (!orderGroups[orderNumber]) orderGroups[orderNumber] = { orderNumber: orderNumber, purchasedDate: purchasedDate, items: [] };
    if (!orderGroups[orderNumber].purchasedDate) orderGroups[orderNumber].purchasedDate = purchasedDate;
    orderGroups[orderNumber].items.push({ itemName: itemName, qty: qty, price: price, status: status });
  }
  DB.pos.forEach(function(po){
    if (po.vendorId!==v.id) return;
    linesForPO(po.id).forEach(function(l){
      var it = itemById(l.itemId);
      addRecord(po.orderNumber, null, it?it.name:(l.name||"Unknown item"), l.qty, l.price, po.status==="created"?"Open order":"Unpurchased");
    });
  });
  DB.purchasedItems.forEach(function(p){
    if (p.vendorId!==v.id) return;
    addRecord(p.orderNumber, p.purchasedDate, p.itemName, p.qty, p.price, "Awaiting receipt");
  });
  DB.receivedItems.forEach(function(r){
    if (r.vendorId!==v.id) return;
    addRecord(r.orderNumber, r.purchasedDate, r.itemName, r.qty, r.price, "Received");
  });

  var orderKeys = Object.keys(orderGroups).sort(function(a,b){ return parseInt(b,10)-parseInt(a,10); });
  if (!orderKeys.length){
    html += '<div class="ds-empty">No order history for this supplier yet.</div>';
    return html;
  }

  html += '<div class="ds-card"><div class="ds-card-title">Order history</div>';
  orderKeys.forEach(function(key){
    var grp = orderGroups[key];
    var total = grp.items.reduce(function(s,r){return s+r.qty*r.price;},0);
    html += '<div style="margin-top:10px;padding-top:10px;border-top:1px solid #eef1f4;">';
    html += '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:6px;"><div style="font-size:13px;font-weight:700;color:#13233a;">Order #'+key+(grp.purchasedDate?(' · purchased '+fmtDate(grp.purchasedDate)):'')+'</div><div style="font-size:12.5px;color:#5b6b80;">'+fmt$(total)+'</div></div>';
    html += '<div style="overflow-x:auto;"><table class="ds-table"><tr><th>Item</th><th>Qty</th><th>Price</th><th>Total</th><th>Status</th></tr>';
    grp.items.forEach(function(r){
      html += '<tr><td><div class="ds-item-name">'+escapeHtml(r.itemName)+'</div></td><td>'+r.qty+'</td><td>'+fmt$(r.price)+'</td><td>'+fmt$(r.qty*r.price)+'</td><td>'+escapeHtml(r.status)+'</td></tr>';
    });
    html += '</table></div>';
    html += '</div>';
  });
  html += '</div>';
  return html;
}

/* One row of the "Vendor pricing" list: a vendor (existing, or a new one
   typed in on the spot) paired with that vendor's price for this item. */
function vendorPriceRowHtml(vendorId, price){
  var vendorOptions = DB.vendors.slice().sort(function(a,b){return a.name.localeCompare(b.name);});
  var isOther = vendorId==="__other__";
  var html = '<div class="ds-vp-row" style="display:flex;gap:8px;align-items:flex-start;margin-bottom:8px;">';
  html += '<div style="flex:1;">';
  html += '<select class="ds-vp-vendor" style="width:100%;">';
  html += '<option value="">— Select vendor —</option>';
  vendorOptions.forEach(function(v){ html += '<option value="'+v.id+'" '+(v.id===vendorId?"selected":"")+'>'+escapeHtml(v.name)+'</option>'; });
  html += '<option value="__other__" '+(isOther?"selected":"")+'>+ New supplier…</option>';
  html += '</select>';
  html += '<input type="text" class="ds-vp-vendor-other" placeholder="Supplier name" style="width:100%;margin-top:4px;'+(isOther?"":"display:none;")+'" />';
  html += '</div>';
  html += '<div style="width:96px;"><input type="number" min="0" step="0.01" class="ds-vp-price" placeholder="Price" value="'+(price!=null?price:"")+'" style="width:100%;" /></div>';
  html += '<button type="button" class="ds-vp-remove" aria-label="Remove this vendor price" style="padding:8px 10px;background:#fff;border:1px solid #d8dee5;border-radius:6px;flex:0 0 auto;">×</button>';
  html += '</div>';
  return html;
}
/* Wires up the "+ Add another vendor price" button and each row's remove
   button and vendor-select (to reveal the "New supplier" text field). Call
   this once, right after the modal's HTML — containing #im-vp-rows and
   #im-vp-add — is in the document. New rows are inserted directly into the
   DOM rather than through a full re-render, so nothing else in the modal
   loses whatever the user has already typed. */
function bindVendorPriceRows(overlay){
  var container = overlay.querySelector("#im-vp-rows");
  var addBtn = overlay.querySelector("#im-vp-add");
  if (!container || !addBtn) return;
  function bindRow(row){
    var sel = row.querySelector(".ds-vp-vendor");
    var other = row.querySelector(".ds-vp-vendor-other");
    sel.addEventListener("change", function(){
      other.style.display = sel.value==="__other__" ? "" : "none";
    });
    row.querySelector(".ds-vp-remove").addEventListener("click", function(){ row.remove(); });
  }
  container.querySelectorAll(".ds-vp-row").forEach(bindRow);
  addBtn.addEventListener("click", function(){
    var wrapper = document.createElement("div");
    wrapper.innerHTML = vendorPriceRowHtml("", null);
    var newRow = wrapper.firstChild;
    container.appendChild(newRow);
    bindRow(newRow);
  });
}
/* Reads every "Vendor pricing" row in the modal and replaces this item's
   DB.itemVendors links with them — rows with no vendor chosen, or no price
   entered, are simply skipped (that's how an item ends up with no pricing
   on file at all). A vendor typed into "+ New supplier…" is created on the
   spot. If a row's price differs from what that vendor was already charging
   for this item, it's logged to DB.priceChanges — the same record the
   Reorder tab's "price changed from X to Y" note reads from — so editing
   prices here behaves exactly like correcting a price on a purchase order
   line. Picking the same vendor twice keeps only the first row. */
function saveVendorPriceRowsForItem(overlay, itemId){
  var priorByVendor = {};
  DB.itemVendors.filter(function(iv){return iv.itemId===itemId;}).forEach(function(iv){ priorByVendor[iv.vendorId] = iv.price; });
  DB.itemVendors = DB.itemVendors.filter(function(iv){return iv.itemId!==itemId;});

  var usedVendorIds = {};
  overlay.querySelectorAll(".ds-vp-row").forEach(function(row){
    var sel = row.querySelector(".ds-vp-vendor");
    var other = row.querySelector(".ds-vp-vendor-other");
    var priceRaw = row.querySelector(".ds-vp-price").value.trim();
    if (priceRaw==="") return;
    var price = Math.max(0, parseFloat(priceRaw));
    var vendorId = sel.value;
    if (vendorId==="__other__"){
      var name = other.value.trim();
      if (!name) return;
      var newVendor = {id: uid("v"), name: name, website:"", contact:"", contactName:""};
      DB.vendors.push(newVendor);
      persist("vendors");
      vendorId = newVendor.id;
    }
    if (!vendorId || usedVendorIds[vendorId]) return;
    usedVendorIds[vendorId] = true;
    var oldPrice = priorByVendor[vendorId];
    if (oldPrice!=null && oldPrice!==price){
      DB.priceChanges.push({id: uid("pc"), itemId: itemId, vendorId: vendorId, oldPrice: oldPrice, newPrice: price, date: todayStr()});
    }
    DB.itemVendors.push({id: uid("iv"), itemId: itemId, vendorId: vendorId, price: price});
  });
  persist("itemVendors"); persist("priceChanges");
}

  } else {
    html += vendorPriceRowHtml("", null);
  }

function openItemModal(itemId){
  var it = itemId ? itemById(itemId) : null;
  var isNew = !it;
  closeModal();
  var overlay = document.createElement("div");
  overlay.id = "ds-modal-overlay";
  overlay.className = "ds-modal-overlay";
  var html = '<div class="ds-modal" style="max-width:480px;">';
  html += '<h2>'+(isNew?"Add item":"Edit item")+'</h2>';
  html += itemModalFieldsHtml(it);
  html += '<div class="ds-modal-actions" style="justify-content:space-between;">';
  html += '<div>';
  if (!isNew){
    html += '<button class="ds-btn-outline" data-action="im-delete" style="color:#b3261e;border-color:#f3b7b2;">Delete item</button> ';
    html += '<button class="ds-btn-outline" data-action="im-duplicate">Duplicate</button>';
  }
  html += '</div>';
  html += '<div>';
  html += '<button class="ds-btn-outline" data-action="im-cancel">Cancel</button> ';
  html += '<button class="ds-btn-primary" data-action="im-save">Save</button>';
  html += '</div>';
  html += '</div>';
  html += '</div>';
  overlay.innerHTML = html;
  document.body.appendChild(overlay);
  bindVendorPriceRows(overlay);

  overlay.querySelector('[data-action="im-cancel"]').addEventListener("click", closeModal);
  overlay.addEventListener("click", function(e){ if (e.target===overlay) closeModal(); });

  overlay.querySelector('[data-action="im-save"]').addEventListener("click", function(){
    var name = document.getElementById("im-name").value.trim();
    if (!name){ alert("Item name is required."); return; }
    var fields = {
      name: name,
      sku: document.getElementById("im-sku").value.trim(),
      specs: document.getElementById("im-specs").value.trim(),
      unit: document.getElementById("im-unit").value.trim() || "each",
      category: document.getElementById("im-category").value,
      tier: document.getElementById("im-tier").value,
      qty: Math.max(0, parseInt(document.getElementById("im-qty").value||"0",10)),
      reorder: Math.max(0, parseInt(document.getElementById("im-reorder").value||"0",10)),
      par: Math.max(0, parseInt(document.getElementById("im-par").value||"0",10)),
      comments: document.getElementById("im-comments").value
    };
    var savedId;
    if (isNew){
      var newItem = {id: uid("i")};
      for (var k in fields) newItem[k] = fields[k];
      DB.items.push(newItem);
      savedId = newItem.id;
    } else {
      for (var k2 in fields) it[k2] = fields[k2];
      savedId = it.id;
    }
    persist("items");
    saveVendorPriceRowsForItem(overlay, savedId);
    closeModal();
    render();
  });

  if (!isNew){
    overlay.querySelector('[data-action="im-delete"]').addEventListener("click", function(){
      if (!confirm("Delete this item? This can’t be undone.")) return;
      DB.items = DB.items.filter(function(i){return i.id!==it.id;});
      DB.itemVendors = DB.itemVendors.filter(function(iv){return iv.itemId!==it.id;});
      DB.catalogedItemIds = DB.catalogedItemIds.filter(function(id){return id!==it.id;});
      DB.poLines = DB.poLines.filter(function(l){return l.itemId!==it.id;});
      persist("items"); persist("itemVendors"); persist("catalogedItemIds"); persist("poLines");
      closeModal();
      render();
    });
    overlay.querySelector('[data-action="im-duplicate"]').addEventListener("click", function(){
      var copy = {};
      for (var k in it) copy[k] = it[k];
      copy.id = uid("i");
      copy.name = it.name + " (copy)";
      DB.items.push(copy);
      persist("items");
      /* Carry the original's vendor pricing over to the duplicate too. */
      vendorsForItem(it.id).forEach(function(vp){
        DB.itemVendors.push({id: uid("iv"), itemId: copy.id, vendorId: vp.vendorId, price: vp.price});
      });
      persist("itemVendors");
      closeModal();
      openItemModal(copy.id);
    });
  }
}

      par: Math.max(0, parseInt(document.getElementById("im-par").value||"0",10)),
      comments: document.getElementById("im-comments").value
    };
    DB.items.push(newItem);
    persist("items");
    saveVendorPriceRowsForItem(overlay, newItem.id);

    var qty = Math.max(1, parseInt(document.getElementById("apo-new-qty").value||"1",10));
    /* Price the new line from the cheapest vendor entered above — the same
       rule automatic PO grouping uses elsewhere — or leave it blank if no
       vendor pricing was entered at all. */
    var vs = vendorsForItem(newItem.id);
    var priceForLine = vs.length ? vs[0].price : null;
    addOrBumpPOLine(po.id, newItem.id, qty, priceForLine);
    closeModal();
    render();
  });
}

function triggerDownload(jsonStr){
  try{
    var blob = new Blob([jsonStr], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "got-signs-inventory-backup-"+todayStr()+".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }catch(e){ /* ignored \u2014 the modal below is the reliable fallback */ }
}

function importDataFromText(text){
  var data;
  try{ data = JSON.parse(text); }
  catch(err){ alert("Couldn't read that \u2014 make sure it's a full Got Signs backup (the exact text from Export data)."); return; }
  if (!data || !Array.isArray(data.items) || !Array.isArray(data.vendors)){
    alert("That doesn't look like a valid Got Signs backup.");
    return;
  }
  if (!confirm("Import this backup? This will replace all current data in this browser.")) return;
  DB.items = data.items || [];
  DB.vendors = data.vendors || [];
  DB.itemVendors = data.itemVendors || [];
  DB.pos = data.pos || [];
  DB.poLines = data.poLines || [];
  DB.purchasedItems = data.purchasedItems || [];
  DB.receivedItems = data.receivedItems || [];
  DB.catalogedItemIds = data.catalogedItemIds || [];
  DB.priceChanges = data.priceChanges || [];
  persist("items"); persist("vendors"); persist("itemVendors"); persist("pos"); persist("poLines"); persist("purchasedItems"); persist("receivedItems"); persist("catalogedItemIds"); persist("priceChanges");
  lsSet("orderCounter", data.orderCounter || 1000);
  lsSet("seeded_v1", true);
  backfillOrderData();
  closeModal();
  state.tab = "dashboard";
  render();
  alert("Backup imported.");
}

   EXPENSES TAB (formerly "Monthly Budget")
   ============================================================ */
var MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
var MONTH_SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function monthKeyForOffset(offset){
  var d = new Date();
  d.setDate(1);
  d.setMonth(d.getMonth()+offset);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
}
function monthLabelForKey(key){
  var parts = key.split("-");
  return MONTH_NAMES[parseInt(parts[1],10)-1] + " " + parts[0];
}
function monthShortLabelForKey(key){
  var parts = key.split("-");
  return MONTH_SHORT[parseInt(parts[1],10)-1] + " '" + parts[0].slice(2);
}
function monthKeyFirstDay(key){ return key + "-01"; }
function monthKeyLastDay(key){
  var parts = key.split("-");
  var y = parseInt(parts[0],10), m = parseInt(parts[1],10);
  var d = new Date(y, m, 0);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function expenseMonthOptions(){
  var opts = [];
  for (var i=-35; i<=0; i++){
    var key = monthKeyForOffset(i);
    opts.push({key: key, label: monthShortLabelForKey(key)});
  }
  return opts;
}
/* Resolves the current expense-tab filter mode into a concrete [dateFrom, dateTo]
   (inclusive, ISO yyyy-mm-dd strings) plus a human label for the header. */
function resolveExpenseRange(){
  var mode = state.expenseMode || "pastMonth";
  var today = todayStr();
  if (mode==="custom"){
    var fromKey = state.expenseCustomFrom || monthKeyForOffset(0);
    var toKey = state.expenseCustomTo || monthKeyForOffset(0);
    if (fromKey > toKey){ var tmp=fromKey; fromKey=toKey; toKey=tmp; }
    var label = fromKey===toKey ? monthLabelForKey(fromKey) : (monthShortLabelForKey(fromKey)+" – "+monthShortLabelForKey(toKey));
    return { dateFrom: monthKeyFirstDay(fromKey), dateTo: monthKeyLastDay(toKey), label: label, isSingleMonth: fromKey===toKey, fromKey: fromKey, toKey: toKey };
  }
  var presets = {
    pastWeek: {days:7, label:"Past week"},
    pastMonth: {days:30, label:"Past month"},
    pastSixMonths: {days:182, label:"Past 6 months"},
    pastYear: {days:365, label:"Past year"}
  };
  var p = presets[mode] || presets.pastMonth;
  return { dateFrom: daysAgoStr(p.days), dateTo: today, label: p.label, isSingleMonth: false };
}
function computeRangeSpend(dateFrom, dateTo){
  var entries = [];
  DB.purchasedItems.forEach(function(p){ if ((p.purchasedDate||"")>=dateFrom && (p.purchasedDate||"")<=dateTo) entries.push(p); });
  DB.receivedItems.forEach(function(r){ if ((r.purchasedDate||"")>=dateFrom && (r.purchasedDate||"")<=dateTo) entries.push(r); });

  var byCategory = {};
  CATEGORY_ORDER.forEach(function(c){ byCategory[c] = {qty:0, total:0}; });
  var grandTotal = 0;
  entries.forEach(function(e){
    var it = itemById(e.itemId);
    var subtotal = e.qty*e.price;
    grandTotal += subtotal;
    var cat = it ? it.category : null;
    if (cat && byCategory[cat]){ byCategory[cat].qty += e.qty; byCategory[cat].total += subtotal; }
  });

  var orderGroups = {};
  entries.forEach(function(e){
    var key = e.orderNumber+"|"+e.purchasedDate;
    if (!orderGroups[key]) orderGroups[key] = { orderNumber: e.orderNumber, vendorId: e.vendorId, purchasedDate: e.purchasedDate, total: 0 };
    orderGroups[key].total += e.qty*e.price;
  });
  var orders = Object.keys(orderGroups).map(function(k){ return orderGroups[k]; });

  return { entries: entries, orders: orders, byCategory: byCategory, grandTotal: grandTotal };
}
function budgetTab(){
  var range = resolveExpenseRange();
  var data = computeRangeSpend(range.dateFrom, range.dateTo);
  var budgetTarget = parseFloat(lsGet("monthlyBudgetTarget", 0)) || 0;
  var mode = state.expenseMode || "pastMonth";

  var html = '<div class="ds-tabs-row">';
  [["pastWeek","Past week"],["pastMonth","Past month"],["pastSixMonths","Past 6 months"],["pastYear","Past year"],["custom","Custom range"]].forEach(function(t){
    var active = mode===t[0];
    html += '<button class="ds-tab-pill'+(active?' active':'')+'" data-expensemode="'+t[0]+'">'+t[1]+'</button>';
  });
  html += '</div>';

  if (mode==="custom"){
    var opts = expenseMonthOptions();
    var fromKey = state.expenseCustomFrom || monthKeyForOffset(0);
    var toKey = state.expenseCustomTo || monthKeyForOffset(0);
    html += '<div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:1rem;flex-wrap:wrap;">';
    html += '<label style="font-size:11.5px;color:#7c8a9b;">From <select data-expense-from style="margin-left:4px;">';
    opts.forEach(function(o){ html += '<option value="'+o.key+'" '+(o.key===fromKey?"selected":"")+'>'+o.label+'</option>'; });
    html += '</select></label>';
    html += '<label style="font-size:11.5px;color:#7c8a9b;">to <select data-expense-to style="margin-left:4px;">';
    opts.forEach(function(o){ html += '<option value="'+o.key+'" '+(o.key===toKey?"selected":"")+'>'+o.label+'</option>'; });
    html += '</select></label>';
    html += '</div>';
  }

  html += '<div style="text-align:center;font-size:15px;font-weight:700;color:#13233a;margin-bottom:1rem;">'+escapeHtml(range.label)+'</div>';

  html += '<div class="ds-card" style="text-align:center;">';
  html += '<div style="font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#7c8a9b;margin-bottom:4px;">Total spent</div>';
  html += '<div style="font-size:34px;font-weight:800;color:#13233a;">'+fmt$(data.grandTotal)+'</div>';
  if (budgetTarget>0 && range.isSingleMonth){
    var pct = Math.min(100, (data.grandTotal/budgetTarget)*100);
    var over = data.grandTotal>budgetTarget;
    var barColor = over ? "#d9453c" : (pct>85 ? "#f2b33d" : "#2f9757");
    html += '<div style="height:10px;background:#eef1f4;border-radius:6px;overflow:hidden;margin:14px auto 8px;max-width:340px;"><div style="height:100%;width:'+pct+'%;background:'+barColor+';"></div></div>';
    html += '<div style="font-size:12.5px;color:'+(over?'#b3261e':'#5b6b80')+';">' + (over
      ? fmt$(data.grandTotal-budgetTarget)+' over your '+fmt$(budgetTarget)+' budget'
      : fmt$(budgetTarget-data.grandTotal)+' left of your '+fmt$(budgetTarget)+' budget') + '</div>';
  }
  html += '<div style="margin-top:14px;display:flex;align-items:center;justify-content:center;gap:8px;">';
  html += '<label style="font-size:11.5px;color:#7c8a9b;" for="budget-target-input">Monthly budget target</label>';
  html += '<input type="number" min="0" step="1" id="budget-target-input" data-action="set-budget-target" value="'+(budgetTarget>0?budgetTarget:"")+'" placeholder="Not set" style="width:110px;text-align:center;" />';
  html += '</div>';
  if (budgetTarget>0 && !range.isSingleMonth) html += '<div style="font-size:11px;color:#9aa5b1;margin-top:6px;">Shown only when viewing a single month</div>';
  html += '</div>';

  if (!data.entries.length){
    html += '<div class="ds-empty">No purchases recorded for '+escapeHtml(range.label)+' yet.</div>';
    return html;
  }

  html += '<div class="ds-card"><div class="ds-card-title">Spending by category</div>';
  CATEGORY_ORDER.forEach(function(key){
    var c = data.byCategory[key];
    var pct = data.grandTotal>0 ? (c.total/data.grandTotal*100) : 0;
    var isOpen = !!state.budgetExpanded[key];
    html += '<div style="margin-bottom:14px;">';
    html += '<button type="button" data-action="toggle-budget-category" data-category="'+key+'" style="all:unset;cursor:pointer;display:block;width:100%;box-sizing:border-box;" aria-expanded="'+(isOpen?"true":"false")+'">';
    html += '<div style="display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;margin-bottom:4px;"><span style="color:#13233a;font-weight:600;">'+(c.qty>0?'<i class="ti '+(isOpen?"ti-chevron-down":"ti-chevron-right")+'" style="font-size:12px;vertical-align:-1px;margin-right:3px;color:#7c8a9b;" aria-hidden="true"></i>':'')+c.qty+' '+CATEGORY_LABELS[key].toLowerCase()+' ordered</span><span style="font-weight:700;color:#13233a;">'+fmt$(c.total)+'</span></div>';
    html += '<div style="height:8px;background:#eef1f4;border-radius:5px;overflow:hidden;"><div style="height:100%;width:'+pct+'%;background:#1b62c4;"></div></div>';
    html += '</button>';
    if (isOpen && c.qty>0){
      var catEntries = data.entries.filter(function(e){ var it = itemById(e.itemId); return it && it.category===key; });
      html += '<div style="overflow-x:auto;margin-top:8px;"><table class="ds-table"><tr><th>Item</th><th>Qty</th><th>Price</th><th>Total</th><th>Vendor</th><th>Date</th></tr>';
      catEntries.sort(function(a,b){return (b.purchasedDate||"").localeCompare(a.purchasedDate||"");}).forEach(function(e){
        var v = vendorById(e.vendorId);
        html += '<tr><td><div class="ds-item-name">'+escapeHtml(e.itemName)+'</div></td><td>'+e.qty+'</td><td>'+fmt$(e.price)+'</td><td>'+fmt$(e.qty*e.price)+'</td><td>'+escapeHtml(v?v.name:"Unknown")+'</td><td>'+fmtDate(e.purchasedDate)+'</td></tr>';
      });
      html += '</table></div>';
    }
    html += '</div>';
  });
  html += '</div>';

  html += '<div class="ds-card"><div class="ds-card-title">Orders in this range</div>';
  html += '<div style="overflow-x:auto;"><table class="ds-table"><tr><th>Order</th><th>Vendor</th><th>Purchased</th><th>Total</th></tr>';
  data.orders.slice().sort(function(a,b){return (a.purchasedDate||"").localeCompare(b.purchasedDate||"");}).forEach(function(g){
    var v = vendorById(g.vendorId);
    var orderKey = g.orderNumber + "|" + g.purchasedDate;
    var isOpen = !!state.budgetExpandedOrders[orderKey];
    html += '<tr class="ds-clickable-row" data-action="toggle-budget-order" data-order-number="'+g.orderNumber+'" data-order-date="'+escapeAttr(g.purchasedDate)+'">';
    html += '<td><i class="ti '+(isOpen?"ti-chevron-down":"ti-chevron-right")+'" style="font-size:12px;vertical-align:-1px;margin-right:4px;color:#7c8a9b;" aria-hidden="true"></i>#'+g.orderNumber+'</td>';
    html += '<td>'+escapeHtml(v?v.name:"Unknown")+'</td><td>'+fmtDate(g.purchasedDate)+'</td><td>'+fmt$(g.total)+'</td></tr>';
    if (isOpen){
      var orderEntries = data.entries.filter(function(e){ return e.orderNumber===g.orderNumber && e.purchasedDate===g.purchasedDate; });
      html += '<tr><td colspan="4" style="padding:0 0 10px;background:#f8fafb;">';
      html += '<table class="ds-table" style="margin:0 0 0 20px;width:calc(100% - 20px);"><tr><th>Item</th><th>Qty</th><th>Price</th><th>Total</th></tr>';
      orderEntries.forEach(function(e){
        html += '<tr><td><div class="ds-item-name">'+escapeHtml(e.itemName)+'</div></td><td>'+e.qty+'</td><td>'+fmt$(e.price)+'</td><td>'+fmt$(e.qty*e.price)+'</td></tr>';
      });
      html += '</table></td></tr>';
    }
  });
  html += '</table></div></div>';

  return html;
}
