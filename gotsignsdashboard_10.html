    '<p>Click any value to edit it: quantity, price, or which supplier it\u2019s assigned to (pick from the dropdown, or choose <b>+ Other</b> to add a brand-new supplier on the spot). Correcting a price here also updates that supplier\u2019s price for that item going forward, everywhere in the app, and notes which supplier\u2019s price changed. An item added with no price yet shows "Not set" until you fill one in.</p>' +
    '<p><b>+ Add item</b> at the bottom of an order lets you pick anything already on file and a quantity, or add a brand-new item on the spot with the same details (and vendor pricing) you\u2019d enter on the Items List.</p>' +
    '<p>As you actually buy items, check their <b>Purchased</b> box \u2014 instead of disappearing, the row just turns more transparent so you can see what\u2019s done and what\u2019s left. When you\u2019re finished shopping that order, click <b>Complete Purchase Order</b>: everything checked off moves into Orders Placed, and anything left unchecked moves to Recommended Orders. <b>Cancel order</b> removes one you\u2019ve decided not to place at all.</p>'
  },
  { title: "Orders Placed", icon:"ti-receipt", html:
    '<p>A running receipt log, grouped by supplier. Items completed from the same original order on the same day are grouped together into one order block with a single shared, editable purchase date.</p>' +
    '<p>Check an item\u2019s <b>Received</b> box once it physically arrives \u2014 that\u2019s the moment it actually gets added to your on-hand stock count, and it moves over to Order History.</p>'
  },
  { title: "Recommended Orders", icon:"ti-file-alert", html:
    '<p>Whatever was left unchecked when a purchase order was completed lands here \u2014 items that are still low in stock but weren\u2019t bought yet. It works exactly like Purchase Orders: edit quantity, price, or vendor, check off <b>Purchased</b> as you buy them (rows turn transparent the same way), and click <b>Complete Purchase Order</b> to send the purchased ones to Orders Placed. Anything still unchecked simply stays here.</p>'
  },
  { title: "Order History", icon:"ti-history", html:
    '<p>Every item you\u2019ve ever received, grouped by supplier and then by the order it came from. <b>Undo</b> reverses a mistake and subtracts the quantity back out of stock.</p>' +
    '<p>Filter by date (<b>last week</b>, <b>past month</b>, <b>last 90 days</b>, <b>last year</b>, or all time), by <b>category</b>, and by <b>supplier</b> \u2014 all three combine together, so you can narrow down to exactly what you\u2019re looking for.</p>'
  },
  { title: "Missing Items", icon:"ti-alert-triangle", html:
    '<p>If some items from an order (same order, same purchase day) have been received while others haven\u2019t shown up yet, those still-missing ones land here automatically.</p>' +
    '<p>Each entry shows the supplier, a link to their site, and an editable phone number so you can follow up. <b>Mark received</b> resolves it once it finally arrives.</p>'
  },
  { title: "Suppliers", icon:"ti-users", html:
    '<p>Your vendor list, one card per supplier. Click a supplier\u2019s name to open its full detail page \u2014 contact info at the top, and every purchase order ever placed with them below (order #, date purchased, item, quantity, price). Click <b>Edit info</b> in the top right of a card to change name, contact, website, or phone. <b>+ Add supplier</b> adds a new one; the trash icon removes one (and its item pricing along with it).</p>'
  },
  { title: "Expenses", icon:"ti-wallet", html:
    '<p>Automatically totals everything marked Purchased or further along \u2014 nothing to enter by hand. Pick a quick range (<b>Past week</b>, <b>Past month</b>, <b>Past 6 months</b>, <b>Past year</b>) or <b>Custom range</b> to choose specific from/to months (e.g. Aug \u201926 to Aug \u201926 shows just August 2026; Aug \u201926 to Dec \u201926 shows everything purchased from August 1 through December 31).</p>' +
    '<p>Shows total spend broken down by category (e.g. "14 vinyls ordered \u2014 $23,000") \u2014 click any category row to expand it and see every individual item behind that total, with quantity, price, supplier, and date. Click it again to collapse.</p>' +
    '<p>Set an optional monthly budget target to see how much you have left, or how far over you are \u2014 shown only while viewing a single month.</p>'
  },
  { title: "Your data & backups", icon:"ti-database", html:
    '<p>Everything is saved automatically in this browser\u2019s storage as you work \u2014 no separate save step. But that storage is tied to this specific browser and file, so it can be lost if you clear browser data, switch devices, or open a different copy of this file.</p>' +
    '<p>Use <b>Export data</b> on the Dashboard regularly to save a full backup, and <b>Import data</b> to restore it. Whenever you\u2019re about to switch to a newer version of this app, export first, then import into the new one \u2014 that\u2019s how everything carries over.</p>'
  }
];
function instructionsTab(){
  var html = '<p style="font-size:13px;color:#5b6b80;margin:0 0 1.25rem;">A quick reference for what each part of the app does and how they fit together.</p>';
  INSTRUCTIONS_SECTIONS.forEach(function(s){
    html += '<div class="ds-card">';
    html += '<div style="display:flex;align-items:center;gap:9px;margin-bottom:.6rem;"><i class="ti '+s.icon+'" style="font-size:17px;color:#1b62c4;" aria-hidden="true"></i><div style="font-size:14.5px;font-weight:700;color:#13233a;">'+s.title+'</div></div>';
    html += '<div style="font-size:13px;color:#445063;line-height:1.6;">'+s.html+'</div>';
    html += '</div>';
  });
  return html;
}

/* ============================================================
   EVENT BINDING
   ============================================================ */
function bindEvents(){
  var root = document.getElementById("ds-root");

  var printBtn = root.querySelector('[data-action="print-page"]');
  if (printBtn) printBtn.addEventListener("click", function(){ window.print(); });

  if (state.tab==="dashboard"){
    root.querySelectorAll('[data-action="status-filter"]').forEach(function(b){
      b.addEventListener("click", function(){
        state.statusFilter = b.getAttribute("data-status");
        state.freqFilter = "all";
        state.tab = "frequency";
        render();
      });
    });
    root.querySelectorAll('[data-action="open-category"]').forEach(function(b){
      b.addEventListener("click", function(){
        var key = b.getAttribute("data-category");
        b.classList.add("flipping-out");
        var done = false;
        function go(){ if (done) return; done = true; state.categoryKey = key; state.tab = "category"; render(); }
        b.addEventListener("transitionend", go, {once:true});
        setTimeout(go, 260);
      });
    });
    var gotoMissing = root.querySelector('[data-action="goto-missing"]');
    if (gotoMissing) gotoMissing.addEventListener("click", function(e){ e.preventDefault(); state.tab="missingItems"; render(); });
    var gotoCatalog = root.querySelector('[data-action="goto-catalog"]');
    if (gotoCatalog) gotoCatalog.addEventListener("click", function(){ state.tab="catalog"; render(); });
    var exportBtn = root.querySelector('[data-action="export-data"]');
    if (exportBtn) exportBtn.addEventListener("click", exportData);
    var triggerImport = root.querySelector('[data-action="trigger-import"]');
    if (triggerImport) triggerImport.addEventListener("click", showImportModal);
  }

  if (state.tab==="category"){
    var back = root.querySelector('[data-action="back-to-dashboard"]');
    if (back) back.addEventListener("click", function(){ state.tab="dashboard"; render(); });
  }

  if (state.tab==="supplierDetail"){
    var backSup = root.querySelector('[data-action="back-to-suppliers"]');
    if (backSup) backSup.addEventListener("click", function(){ state.tab="suppliers"; state.supplierKey=null; render(); });
  }

  if (state.tab==="frequency"){
    root.querySelectorAll("[data-freqtab]").forEach(function(b){
      b.addEventListener("click", function(){ state.freqFilter = b.getAttribute("data-freqtab"); render(); });
    });
    root.querySelectorAll("[data-ilcat]").forEach(function(b){
      b.addEventListener("click", function(){ state.itemsListCategory = b.getAttribute("data-ilcat"); render(); });
    });
    root.querySelectorAll("[data-statustab]").forEach(function(b){
      b.addEventListener("click", function(){
        var v = b.getAttribute("data-statustab");
        state.statusFilter = (v==="all") ? null : v;
        render();
      });
    });
    var ilSearch = root.querySelector("[data-il-search]");
    if (ilSearch) ilSearch.addEventListener("input", function(){
      state.search = ilSearch.value;
      renderMain();
      var main = document.getElementById("ds-main");
      var inp = main.querySelector("[data-il-search]");
      if (inp){ inp.focus(); var v=inp.value; inp.value=""; inp.value=v; }
    });
    var addListItem = root.querySelector('[data-action="add-list-item"]');
    if (addListItem) addListItem.addEventListener("click", function(){ openItemModal(null); });
    root.querySelectorAll('[data-action="edit-list-item"]').forEach(function(b){
      b.addEventListener("click", function(){ openItemModal(b.getAttribute("data-item")); });
    });
  }

  if (state.tab==="catalog"){
    root.querySelectorAll("[data-catalogtab]").forEach(function(b){
      b.addEventListener("click", function(){ state.catalogTab = b.getAttribute("data-catalogtab"); render(); });
    });
    root.querySelectorAll("[data-catalogfreq]").forEach(function(b){
      b.addEventListener("click", function(){ state.catalogFreq = b.getAttribute("data-catalogfreq"); render(); });
    });
    var searchInp = root.querySelector("[data-catalog-search]");
    if (searchInp) searchInp.addEventListener("input", function(){
      state.search = searchInp.value;
      renderMain();
      var main = document.getElementById("ds-main");
      var inp = main.querySelector("[data-catalog-search]");
      if (inp){ inp.focus(); var v=inp.value; inp.value=""; inp.value=v; }
    });
    root.querySelectorAll("[data-qty]").forEach(function(inp){
      inp.addEventListener("change", function(){
        var it = itemById(inp.getAttribute("data-qty"));
        if (it){
          it.qty = Math.max(0, parseInt(inp.value||"0",10));
          persist("items");
          lsSet("lastInventoryDate", todayStr());
          renderMain();
        }
      });
    });
    root.querySelectorAll("[data-ideal]").forEach(function(inp){
      inp.addEventListener("change", function(){
        var it = itemById(inp.getAttribute("data-ideal"));
        if (it){ it.par = Math.max(0, parseInt(inp.value||"0",10)); persist("items"); }
      });
    });
    root.querySelectorAll('[data-action="toggle-catalog-verified"]').forEach(function(cb){
      cb.addEventListener("change", function(){
        toggleCatalogVerified(cb.getAttribute("data-item"), cb.checked);
        renderMain();
      });
    });
    var createPoBtn = root.querySelector('[data-action="create-po-from-catalog"]');
    if (createPoBtn) createPoBtn.addEventListener("click", createPurchaseOrderFromCatalog);
    var catalogAddBtn = root.querySelector('[data-action="catalog-add-item"]');
    if (catalogAddBtn) catalogAddBtn.addEventListener("click", function(){ openItemModal(null); });
    root.querySelectorAll('[data-action="catalog-edit-item"]').forEach(function(b){
      b.addEventListener("click", function(){ openItemModal(b.getAttribute("data-item")); });
    });
  }

  if (state.tab==="reorder"){
    root.querySelectorAll("[data-reordersort]").forEach(function(b){
      b.addEventListener("click", function(){ state.reorderSort = b.getAttribute("data-reordersort"); render(); });
    });
    root.querySelectorAll('[data-action="add-to-po"]').forEach(function(b){
      b.addEventListener("click", function(){ addItemToPurchaseOrder(b.getAttribute("data-item")); });
    });
  }

  if (state.tab==="purchaseOrders" || state.tab==="unpurchasedOrders"){
    root.querySelectorAll('[data-action="cancel-po"]').forEach(function(b){
      b.addEventListener("click", function(){ cancelCreatedPO(b.getAttribute("data-poid")); });
    });

    root.querySelectorAll('[data-action="edit-po-field"]').forEach(function(el){
      function activate(){
        var field = el.getAttribute("data-field"), id = el.getAttribute("data-id");
        state.poEditing = {field: field, id: id};
        renderMain();
        var sel = field==="qty" ? '[data-line-qty="'+id+'"]' : field==="price" ? '[data-line-price="'+id+'"]' : field==="vendor" ? '[data-line-vendor="'+id+'"]' : '[data-vendor-contact="'+id+'"]';
        var target = document.querySelector(sel);
        if (target){ target.focus(); if (target.select) target.select(); }
      }
      el.addEventListener("click", activate);
      el.addEventListener("keydown", function(e){ if (e.key==="Enter" || e.key===" "){ e.preventDefault(); activate(); } });
    });

    root.querySelectorAll('[data-line-qty]').forEach(function(inp){
      inp.addEventListener("change", function(){
        var line = DB.poLines.find(function(l){return l.id===inp.getAttribute("data-line-qty");});
        if (line) line.qty = Math.max(1, parseInt(inp.value||"1",10));
        persist("poLines"); state.poEditing = null; renderMain();
      });
      inp.addEventListener("blur", function(){
        if (isEditingPO("qty", inp.getAttribute("data-line-qty"))){ state.poEditing = null; renderMain(); }
      });
    });
    root.querySelectorAll('[data-line-price]').forEach(function(inp){
      inp.addEventListener("change", function(){
        var line = DB.poLines.find(function(l){return l.id===inp.getAttribute("data-line-price");});
        if (line){
          var newPrice = Math.max(0, parseFloat(inp.value||"0"));
          line.price = newPrice;
          var linePO = poById(line.poId);
          /* Only record this as a supplier's price if a real vendor is assigned —
             a line still sitting in the "no vendor assigned yet" group has no
             vendor to attach a price to. */
          if (linePO && linePO.vendorId!=null) updateVendorPriceForLine(line.itemId, linePO.vendorId, newPrice);
        }
        persist("poLines"); state.poEditing = null; renderMain();
      });
      inp.addEventListener("blur", function(){
        if (isEditingPO("price", inp.getAttribute("data-line-price"))){ state.poEditing = null; renderMain(); }
      });
    });
    root.querySelectorAll('[data-line-vendor]').forEach(function(sel){
      sel.addEventListener("change", function(){
        var lineId = sel.getAttribute("data-line-vendor");
        state.poEditing = null;
        if (sel.value==="__other__"){
          var name = prompt("New supplier name:");
          if (name) addNewVendorAndMoveLine(lineId, name);
          else render();
        } else {
          moveLineToVendor(lineId, sel.value);
        }
      });
      sel.addEventListener("blur", function(){
        if (isEditingPO("vendor", sel.getAttribute("data-line-vendor"))){ state.poEditing = null; renderMain(); }
      });
    });
    root.querySelectorAll('[data-action="remove-po-line"]').forEach(function(b){
      b.addEventListener("click", function(){ removePOLine(b.getAttribute("data-lineid")); });
    });
    root.querySelectorAll('[data-action="toggle-line-purchased"]').forEach(function(cb){
      cb.addEventListener("change", function(){
        var line = DB.poLines.find(function(l){return l.id===cb.getAttribute("data-lineid");});
        if (line){
          line.purchased = cb.checked;
          line.purchasedOnDate = cb.checked ? todayStr() : null;
          persist("poLines");
        }
        renderMain();
      });
    });
    root.querySelectorAll('[data-action="complete-po"]').forEach(function(b){
      b.addEventListener("click", function(){ completePurchaseOrder(b.getAttribute("data-poid")); });
    });
    root.querySelectorAll('[data-action="open-add-po-item"]').forEach(function(b){
      b.addEventListener("click", function(){ openAddPOItemModal(b.getAttribute("data-poid")); });
    });
    root.querySelectorAll('[data-vendor-contact]').forEach(function(inp){
      inp.addEventListener("change", function(){
        updateVendorContact(inp.getAttribute("data-vendor-contact"), inp.value);
        state.poEditing = null; renderMain();
      });
      inp.addEventListener("blur", function(){
        if (isEditingPO("phone", inp.getAttribute("data-vendor-contact"))){ state.poEditing = null; renderMain(); }
      });
    });
  }

  if (state.tab==="pendingOrders"){
    root.querySelectorAll('[data-group-order]').forEach(function(inp){
      inp.addEventListener("change", function(){
        var orderNumber = parseInt(inp.getAttribute("data-group-order"),10);
        var oldDate = inp.getAttribute("data-group-olddate");
        updatePurchasedDateGroup(orderNumber, oldDate, inp.value);
      });
    });
    root.querySelectorAll('[data-action="remove-purchased-item"]').forEach(function(b){
      b.addEventListener("click", function(){ removePurchasedItem(b.getAttribute("data-id")); });
    });
    root.querySelectorAll('[data-action="toggle-item-received"]').forEach(function(cb){
      cb.addEventListener("change", function(){
        var p = DB.purchasedItems.find(function(x){return x.id===cb.getAttribute("data-id");});
        if (p){ p.receivedPending = cb.checked; persist("purchasedItems"); }
        renderMain();
      });
    });
    root.querySelectorAll('[data-action="confirm-group-received"]').forEach(function(b){
      b.addEventListener("click", function(){
        confirmGroupReceived(parseInt(b.getAttribute("data-order-number"),10), b.getAttribute("data-order-date"));
      });
    });
  }

  if (state.tab==="ordersReceived"){
    root.querySelectorAll('[data-action="undo-received"]').forEach(function(b){
      b.addEventListener("click", function(){ undoItemReceived(b.getAttribute("data-id")); });
    });
    root.querySelectorAll("[data-historyrange]").forEach(function(b){
      b.addEventListener("click", function(){ state.historyDateRange = b.getAttribute("data-historyrange"); render(); });
    });
    root.querySelectorAll("[data-historycat]").forEach(function(b){
      b.addEventListener("click", function(){ state.historyCategory = b.getAttribute("data-historycat"); render(); });
    });
    var supplierSel = root.querySelector("[data-historysupplier]");
    if (supplierSel) supplierSel.addEventListener("change", function(){ state.historySupplier = supplierSel.value; render(); });
  }

  if (state.tab==="missingItems"){
    root.querySelectorAll('[data-action="resolve-missing"]').forEach(function(b){
      b.addEventListener("click", function(){ markItemReceived(b.getAttribute("data-id")); });
    });
    root.querySelectorAll('[data-vendor-contact]').forEach(function(inp){
      inp.addEventListener("change", function(){ updateVendorContact(inp.getAttribute("data-vendor-contact"), inp.value); });
    });
  }

  if (state.tab==="suppliers"){
    var addSupplier = root.querySelector('[data-action="add-supplier"]');
    if (addSupplier) addSupplier.addEventListener("click", function(){
      var name = prompt("Supplier name:");
      if (!name) return;
      DB.vendors.push({id: uid("v"), name:name, website:"", contact:"", contactName:""});
      persist("vendors"); render();
    });
    root.querySelectorAll('[data-action="open-supplier"]').forEach(function(b){
      b.addEventListener("click", function(){
        state.supplierKey = b.getAttribute("data-supplier");
        state.tab = "supplierDetail";
        render();
      });
    });
    root.querySelectorAll('[data-action="edit-supplier"]').forEach(function(b){
      b.addEventListener("click", function(){ state.supplierEditing = b.getAttribute("data-supplier"); render(); });
    });
    root.querySelectorAll('[data-action="done-edit-supplier"]').forEach(function(b){
      b.addEventListener("click", function(){ state.supplierEditing = null; render(); });
    });
    root.querySelectorAll('[data-supplier-field]').forEach(function(inp){
      inp.addEventListener("change", function(){
        var v = vendorById(inp.getAttribute("data-supplier"));
        if (v){ v[inp.getAttribute("data-supplier-field")] = inp.value; persist("vendors"); render(); }
      });
    });
    root.querySelectorAll('[data-action="remove-supplier"]').forEach(function(b){
      b.addEventListener("click", function(){
        var id = b.getAttribute("data-supplier");
        if (!confirm("Remove this supplier? This will also remove their pricing links to items.")) return;
        DB.vendors = DB.vendors.filter(function(v){return v.id!==id;});
        DB.itemVendors = DB.itemVendors.filter(function(iv){return iv.vendorId!==id;});
        persist("vendors"); persist("itemVendors"); render();
      });
    });
  }

  if (state.tab==="budget"){
    root.querySelectorAll("[data-expensemode]").forEach(function(b){
      b.addEventListener("click", function(){ state.expenseMode = b.getAttribute("data-expensemode"); render(); });
    });
    var expFrom = root.querySelector("[data-expense-from]");
    if (expFrom) expFrom.addEventListener("change", function(){ state.expenseCustomFrom = expFrom.value; render(); });
    var expTo = root.querySelector("[data-expense-to]");
    if (expTo) expTo.addEventListener("change", function(){ state.expenseCustomTo = expTo.value; render(); });
    var targetInp = root.querySelector('[data-action="set-budget-target"]');
    if (targetInp) targetInp.addEventListener("change", function(){
      lsSet("monthlyBudgetTarget", Math.max(0, parseFloat(targetInp.value||"0")));
      render();
    });
    root.querySelectorAll('[data-action="toggle-budget-category"]').forEach(function(b){
      b.addEventListener("click", function(){
        var key = b.getAttribute("data-category");
        state.budgetExpanded[key] = !state.budgetExpanded[key];
        render();
      });
    });
    root.querySelectorAll('[data-action="toggle-budget-order"]').forEach(function(tr){
      tr.addEventListener("click", function(){
        var key = tr.getAttribute("data-order-number") + "|" + tr.getAttribute("data-order-date");
        state.budgetExpandedOrders[key] = !state.budgetExpandedOrders[key];
        render();
      });
    });
  }
}

/* ---------------- boot ---------------- */
loadDB();
render();
if (!storageWorks) showSaveWarning();

})();
</script>
</body>
</html>
