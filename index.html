<style>
  * { box-sizing: border-box; }
  html, body {
    margin:0; padding:0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:#eef1f4; color:#13233a;
  }
  .ti { font-family: 'tabler-icons' !important; font-style: normal; }
  .no-iconfont .ti { display:none; }
  button { cursor:pointer; font-family: inherit; }
  input[type="number"], input[type="text"], select {
    font-size:13px; padding:7px 9px; border-radius:6px; border:1px solid #d8dee5; background:#fff; color:#13233a; font-family: inherit;
  }
  :focus-visible{ outline:2px solid #1b62c4; outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }

  #ds-savewarning { display:none; background:#fdf0cd; color:#5b4007; font-size:12px; padding:8px 14px; text-align:center; }

  #ds-app { display:flex; min-height:100vh; background:#f4f6f8; padding-top:env(safe-area-inset-top); padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right); }
  #ds-sidebar { width:200px; flex:0 0 200px; background:#10243f; color:#cdd9e8; padding:1.25rem 0; }

function loadDB(){
  var seeded = lsGet("seeded_v1", null);
  if (!seeded){
    DB = sampleData();
    persist("items"); persist("vendors"); persist("itemVendors"); persist("pos"); persist("poLines"); persist("purchasedItems"); persist("receivedItems");
    lsSet("seeded_v1", true);
  } else {
    DB.items = lsGet("items", []);
    DB.vendors = lsGet("vendors", []);
    DB.itemVendors = lsGet("itemVendors", []);
    DB.pos = lsGet("pos", []);
    DB.poLines = lsGet("poLines", []);
    DB.purchasedItems = lsGet("purchasedItems", []);
    DB.receivedItems = lsGet("receivedItems", []);
    backfillOrderData();
  }
}
function backfillOrderData(){
  var changed = false, vendorsChanged = false;
  DB.vendors.forEach(function(v){
    if (v.contactName == null){ v.contactName = ""; vendorsChanged = true; }
  });
  DB.pos.forEach(function(po){
    if (po.orderNumber == null){ po.orderNumber = nextOrderNumber(); changed = true; }
  });
  DB.poLines.forEach(function(line){
    if (!line.name){
      var it = itemById(line.itemId);
      if (it){ line.name = it.name; changed = true; }
    }
  });
  if (changed){ persist("pos"); persist("poLines"); }
  if (vendorsChanged){ persist("vendors"); }
}
function persist(part){
  if (part==="items") lsSet("items", DB.items);
  if (part==="vendors") lsSet("vendors", DB.vendors);
  if (part==="itemVendors") lsSet("itemVendors", DB.itemVendors);
  if (part==="pos") lsSet("pos", DB.pos);
  if (part==="poLines") lsSet("poLines", DB.poLines);
  if (part==="purchasedItems") lsSet("purchasedItems", DB.purchasedItems);
  if (part==="receivedItems") lsSet("receivedItems", DB.receivedItems);
}

/* ============================================================
   HELPERS
   ============================================================ */
function itemById(id){ return DB.items.find(function(i){return i.id===id;}); }
function vendorById(id){ return DB.vendors.find(function(v){return v.id===id;}); }
function vendorsForItem(itemId){
  return DB.itemVendors.filter(function(iv){return iv.itemId===itemId;}).map(function(iv){
    var v = vendorById(iv.vendorId);
    return {vendorId: iv.vendorId, vendorName: v?v.name:"Unknown", website: v?v.website:"", price: iv.price};
  }).sort(function(a,b){return a.price-b.price;});
}
function fmt$(n){ return "$" + (Math.round(n*100)/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>]/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];}); }
function escapeAttr(s){ return escapeHtml(s).replace(/"/g,"&quot;"); }

function stockStatus(it){
  if (it.qty <= it.reorder) return "low";
  if (it.qty <= it.reorder + Math.max(1, Math.round((it.par-it.reorder)*0.4))) return "warning";
  return "optimal";
}
function statusRank(s){ return s==="low"?0:(s==="warning"?1:2); }
function badgeForStatus(s){
  if (s==="low") return '<span class="ds-badge ds-badge-low">Low</span>';
  if (s==="warning") return '<span class="ds-badge ds-badge-warning">Warning</span>';
  return '<span class="ds-badge ds-badge-optimal">Optimal</span>';
}
function dotForStatus(s){
  var cls = s==="low"?"ds-dot-low":(s==="warning"?"ds-dot-warning":"ds-dot-optimal");
  return '<span class="ds-dot '+cls+'" aria-hidden="true"></span>';
}
function needed(it){ return Math.max(0, it.par - it.qty); }

function sortByUrgency(list){
  return list.slice().sort(function(a,b){
    var ra = statusRank(stockStatus(a)), rb = statusRank(stockStatus(b));
    if (ra!==rb) return ra-rb;
    var da = a.qty - a.reorder, db = b.qty - b.reorder;
    if (da!==db) return da-db;
    return a.name.localeCompare(b.name);
  });
}
function countByStatus(list, s){ return list.filter(function(it){ return stockStatus(it)===s; }).length; }

function todayStr(){ var d=new Date(); return d.toISOString().slice(0,10); }
function fmtDate(s){
  if (!s) return "\u2014";
  var d = new Date(s+"T00:00:00");
  if (isNaN(d.getTime())) return s;
  var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return d.getDate()+" "+months[d.getMonth()]+" "+d.getFullYear();
}
function poById(id){ return DB.pos.find(function(p){return p.id===id;}); }
function linesForPO(id){ return DB.poLines.filter(function(l){return l.poId===id;}); }

/* An item is "committed" to an open order if it has a line that isn't yet
   confirmed received, on a PO that hasn't been cancelled. Committed items
   are skipped when generating new purchase orders, so nothing gets ordered twice. */
function committedItemIds(){
  var set = {};
  DB.poLines.forEach(function(l){
    var po = poById(l.poId);
    if (po && po.status==="created") set[l.itemId] = true;
  });
  return set;
}

/* Groups any newly-low items (that aren't already committed to an open order)
   by cheapest vendor, merging into an existing "created" PO for that vendor
   if one exists, or creating a new one. Safe to call repeatedly. */
function nextOrderNumber(){
  var n = lsGet("orderCounter", 1000) + 1;
  lsSet("orderCounter", n);
  return n;
}

function syncPurchaseOrders(){
  var committed = committedItemIds();
  var eligible = DB.items.filter(function(it){
    var s = stockStatus(it);
    return (s==="low" || s==="warning") && !committed[it.id];
  });
  if (!eligible.length) return;
  var changed = false;
  eligible.forEach(function(it){
    var vs = vendorsForItem(it.id);
    if (!vs.length) return;
    var cheapest = vs[0];
    var qty = Math.max(1, needed(it));
    var openPO = DB.pos.find(function(p){ return p.status==="created" && p.vendorId===cheapest.vendorId; });
    if (!openPO){
      openPO = {id: uid("po"), vendorId: cheapest.vendorId, orderNumber: nextOrderNumber(), status:"created", createdDate: todayStr(), purchasedDate:""};
      DB.pos.push(openPO);
    }
    DB.poLines.push({id: uid("pl"), poId: openPO.id, itemId: it.id, name: it.name, qty: qty, price: cheapest.price});
    changed = true;
  });
  if (changed){ persist("pos"); persist("poLines"); }
}

/* Moves a PO line to a different vendor's "created" order (creating one if
   needed), since a purchase order is always for a single vendor. Cleans up
   the old order if it's left empty. */
function moveLineToVendor(lineId, vendorId){
  var line = DB.poLines.find(function(l){return l.id===lineId;});
  if (!line) return;
  var oldPO = poById(line.poId);
  if (!oldPO || oldPO.vendorId===vendorId) return;
  var targetPO = DB.pos.find(function(p){ return p.status==="created" && p.vendorId===vendorId; });
  if (!targetPO){
    targetPO = {id: uid("po"), vendorId: vendorId, orderNumber: nextOrderNumber(), status:"created", createdDate: todayStr(), purchasedDate:""};
    DB.pos.push(targetPO);
  }
  line.poId = targetPO.id;
  if (linesForPO(oldPO.id).length===0){
    DB.pos = DB.pos.filter(function(p){return p.id!==oldPO.id;});
  }
  persist("pos"); persist("poLines");
  render();
}
function addNewVendorAndMoveLine(lineId, name){
  var v = {id: uid("v"), name: name, website:"", contact:"", contactName:""};
  DB.vendors.push(v);
  persist("vendors");
  moveLineToVendor(lineId, v.id);
}
function removePOLine(lineId){
  if (!confirm("Remove this item from the order?")) return;
  var line = DB.poLines.find(function(l){return l.id===lineId;});
  if (!line) return;
  var poId = line.poId;
  DB.poLines = DB.poLines.filter(function(l){return l.id!==lineId;});
  if (linesForPO(poId).length===0){
    DB.pos = DB.pos.filter(function(p){return p.id!==poId;});
  }
  persist("pos"); persist("poLines");
  render();
}

/* Checking an item off on the Purchase Orders tab moves it out of that order
   and into the Purchased Orders ledger, recording qty/item/price paid as of
   right now, with today's date (editable afterward). Cleans up the parent
   order if that was its last remaining line. */
function markLinePurchased(lineId){
  var line = DB.poLines.find(function(l){return l.id===lineId;});
  if (!line) return;
  var po = poById(line.poId);
  if (!po) return;
  var it = itemById(line.itemId);
  DB.purchasedItems.push({
    id: uid("pi"),
    orderNumber: po.orderNumber,
    vendorId: po.vendorId,
    itemId: line.itemId,
    itemName: it ? it.name : (line.name || "Unknown item"),
    qty: line.qty,
    price: line.price,
    purchasedDate: todayStr()
  });
  DB.poLines = DB.poLines.filter(function(l){return l.id!==lineId;});
  if (linesForPO(po.id).length===0){
    DB.pos = DB.pos.filter(function(p){return p.id!==po.id;});
  }
  persist("pos"); persist("poLines"); persist("purchasedItems");
  render();
}
function removePurchasedItem(id){
  if (!confirm("Remove this purchased record? This won't affect stock levels or the original order.")) return;
  DB.purchasedItems = DB.purchasedItems.filter(function(p){return p.id!==id;});
  persist("purchasedItems");
  render();
}
function updatePurchasedDateGroup(orderNumber, oldDate, newValue){
  DB.purchasedItems.forEach(function(p){
    if (p.orderNumber===orderNumber && p.purchasedDate===oldDate) p.purchasedDate = newValue;
  });
  persist("purchasedItems");
  render();
}

/* Correcting a PO line's price is treated as the real, current price from
   that vendor going forward — it updates (or creates) the item's vendor
   pricing record, not just this one order. */
function updateVendorPriceForLine(itemId, vendorId, newPrice){
  var iv = DB.itemVendors.find(function(x){return x.itemId===itemId && x.vendorId===vendorId;});
  if (iv){ iv.price = newPrice; }
  else { DB.itemVendors.push({id: uid("iv"), itemId: itemId, vendorId: vendorId, price: newPrice}); }
  persist("itemVendors");
}

function cancelCreatedPO(poId){
  if (!confirm("Cancel this purchase order? It hasn't been purchased yet.")) return;
  DB.pos = DB.pos.filter(function(p){return p.id!==poId;});
  DB.poLines = DB.poLines.filter(function(l){return l.poId!==poId;});
  persist("pos"); persist("poLines");
  render();
}
function updateVendorContact(vendorId, value){
  var v = vendorById(vendorId);
  if (v){ v.contact = value; persist("vendors"); }
}

/* Checking an item "Received" on the Purchased Orders tab moves it into
   Orders Received and adds its quantity to stock \u2014 the point at which it
   actually counts as inventory on the shelf. */
function markItemReceived(purchasedItemId){
  var p = DB.purchasedItems.find(function(x){return x.id===purchasedItemId;});
  if (!p) return;
  DB.purchasedItems = DB.purchasedItems.filter(function(x){return x.id!==purchasedItemId;});
  var it = itemById(p.itemId);
  if (it) it.qty += p.qty;
  DB.receivedItems.push({
    id: uid("ri"), orderNumber: p.orderNumber, vendorId: p.vendorId, itemId: p.itemId,
    itemName: p.itemName, qty: p.qty, price: p.price, purchasedDate: p.purchasedDate, receivedDate: todayStr()
  });
  persist("items"); persist("purchasedItems"); persist("receivedItems");
  render();
}
function undoItemReceived(receivedItemId){
  var r = DB.receivedItems.find(function(x){return x.id===receivedItemId;});
  if (!r) return;
  DB.receivedItems = DB.receivedItems.filter(function(x){return x.id!==receivedItemId;});
  var it = itemById(r.itemId);
  if (it) it.qty = Math.max(0, it.qty - r.qty);
  DB.purchasedItems.push({
    id: uid("pi"), orderNumber: r.orderNumber, vendorId: r.vendorId, itemId: r.itemId,
    itemName: r.itemName, qty: r.qty, price: r.price, purchasedDate: r.purchasedDate
  });
  persist("items"); persist("purchasedItems"); persist("receivedItems");
  render();
}

/* An item counts as "missing" once at least one other item from the same
   original order has already been received, while this one is still sitting
   unreceived in Purchased Orders \u2014 i.e. a short/partial shipment. */
function computeMissingLines(){
  var receivedGroupKeys = {};
  DB.receivedItems.forEach(function(r){ receivedGroupKeys[r.orderNumber+"|"+r.purchasedDate] = true; });
  var result = [];
  DB.purchasedItems.forEach(function(p){
    if (receivedGroupKeys[p.orderNumber+"|"+p.purchasedDate]){
      result.push({ item: itemById(p.itemId), purchased: p, vendor: vendorById(p.vendorId) });
    }
  });
  return result;
}

  bindEvents();

function renderMain(){
  if (isRendering) return;
  isRendering = true;
  var main = document.getElementById("ds-main");
  if (!main){ isRendering = false; render(); return; }
  main.innerHTML = mainContent();
  bindEvents();
  isRendering = false;
}
function bindSidebarEvents(){
  var root = document.getElementById("ds-root");
  root.querySelectorAll("[data-tab]").forEach(function(b){

      var tab = b.getAttribute("data-tab");
      if (tab==="purchaseOrders") syncPurchaseOrders();
      state.tab = tab; state.search=""; state.poEditing=null; state.budgetMonthOffset=0; render();
    });
  });
}

function dashboardTab(){
  var lowCount = countByStatus(DB.items,"low");
  var warnCount = countByStatus(DB.items,"warning");
  var okCount = countByStatus(DB.items,"optimal");

  var html = "";
  var missing = computeMissingLines();
  if (missing.length){
    var names = missing.map(function(m){ return m.item ? m.item.name : "Unknown item"; });
    var shown = names.slice(0,4).join(", ");
    if (names.length>4) shown += ", and "+(names.length-4)+" more";
    html += '<div class="ds-missing-banner"><i class="ti ti-alert-triangle" aria-hidden="true"></i><div style="flex:1;"><div class="ds-missing-banner-title">'+missing.length+' item'+(missing.length===1?"":"s")+' missing from received orders</div><div class="ds-missing-banner-list">'+escapeHtml(shown)+'</div></div><a href="#" data-action="goto-missing">View missing items \u2192</a></div>';
  }

  html += '<div class="ds-statusrow">';
  html += '<button class="ds-statusbtn ds-statusbtn-red" data-action="status-filter" data-status="low"><div class="ds-statusnum">'+lowCount+'</div><div class="ds-statuslabel">LOW STOCK \u2014 REPLENISH NOW</div></button>';
  html += '<button class="ds-statusbtn ds-statusbtn-yellow" data-action="status-filter" data-status="warning"><div class="ds-statusnum">'+warnCount+'</div><div class="ds-statuslabel">RUNNING LOW \u2014 REPLENISH SOON</div></button>';
  html += '<button class="ds-statusbtn ds-statusbtn-green" data-action="status-filter" data-status="optimal"><div class="ds-statusnum">'+okCount+'</div><div class="ds-statuslabel">IN STOCK</div></button>';
  html += '</div>';

  html += '<div class="ds-catgrid">';
  CATEGORY_ORDER.forEach(function(key){
    var items = DB.items.filter(function(it){return it.category===key;});
    var lowInCat = countByStatus(items,"low") + countByStatus(items,"warning");
    var sub = lowInCat>0 ? (lowInCat+" item"+(lowInCat===1?"":"s")+" need attention") : "All stocked";
    html += '<button class="ds-catbox" data-action="open-category" data-category="'+key+'">';
    html += '<i class="ti '+CATEGORY_ICONS[key]+' ds-catbox-icon" aria-hidden="true"></i>';
    html += '<div><div class="ds-catbox-name">'+CATEGORY_LABELS[key]+'</div><div class="ds-catbox-sub">'+escapeHtml(sub)+'</div></div>';
    html += '</button>';
  });
  html += '</div>';
  var lastInv = lsGet("lastInventoryDate", "");
  html += '<div style="text-align:center;font-size:12px;color:#7c8a9b;margin-top:1.75rem;">Inventory last taken: '+(lastInv?fmtDate(lastInv):"Never")+'</div>';
  html += '<button class="ds-bigcta" data-action="goto-catalog" style="margin-top:8px;"><i class="ti ti-clipboard-list" aria-hidden="true"></i>Take Inventory</button>';
  html += '<div style="display:flex;align-items:center;justify-content:center;gap:16px;margin-top:14px;">';
  html += '<button class="ds-btn-outline" data-action="export-data"><i class="ti ti-download" style="font-size:13px;vertical-align:-2px;margin-right:4px;" aria-hidden="true"></i>Export data</button>';
  html += '<button class="ds-btn-outline" data-action="trigger-import"><i class="ti ti-upload" style="font-size:13px;vertical-align:-2px;margin-right:4px;" aria-hidden="true"></i>Import data</button>';
  html += '</div>';
  return html;
}

  }

}

function reorderTab(){
  var list = sortByUrgency(DB.items.filter(function(it){ var s = stockStatus(it); return s==="low" || s==="warning"; }));
  if (!list.length){
    return '<div class="ds-empty">Nothing needs reordering right now \u2014 everything is stocked above its reorder point.</div>';
  }
  var html = '<p style="font-size:12.5px;color:#5b6b80;margin:0 0 1rem;">These items are at or below their reorder point. Pick a vendor to open their site and place the order directly.</p>';
  list.forEach(function(it){
    var s = stockStatus(it);
    var vs = vendorsForItem(it.id);
    html += '<div class="ds-card">';
    html += '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;">';
    html += '<div><div class="ds-item-name">'+escapeHtml(it.name)+'</div>' + (it.specs?'<div class="ds-item-specs">'+escapeHtml(it.specs)+'</div>':'') + '<div style="font-size:11.5px;color:#7c8a9b;margin-top:3px;">'+CATEGORY_LABELS[it.category]+' \u00b7 '+TIERS[it.tier].label+'</div></div>';
    html += badgeForStatus(s);
    html += '</div>';
    html += '<div style="font-size:12.5px;color:#5b6b80;margin:8px 0;">On hand <b>'+it.qty+'</b> '+escapeHtml(it.unit)+(it.qty===1?'':'s')+' \u00b7 reorder at <b>'+it.reorder+'</b> \u00b7 need <b>'+needed(it)+'</b> more</div>';
    if (!vs.length){
      html += '<div style="font-size:12px;color:#b3261e;">No vendor priced for this item yet.</div>';
    } else {
      vs.forEach(function(o,idx){
        if (o.website){
          html += '<a class="ds-order-link" href="'+escapeAttr(o.website)+'" target="_blank" rel="noopener noreferrer">'+escapeHtml(o.vendorName)+' \u2014 '+fmt$(o.price)+ (idx===0?'<span class="ds-best">Best price</span>':'') +' <i class="ti ti-external-link" style="font-size:12px;" aria-hidden="true"></i></a>';
        } else {
          html += '<span class="ds-order-link" style="opacity:.6;">'+escapeHtml(o.vendorName)+' \u2014 '+fmt$(o.price)+' (no website on file)</span>';
        }
      });
    }
    html += '</div>';
  });
  return html;
}

/* ============================================================
   PURCHASED ORDERS TAB
   ============================================================ */
function purchasedOrdersTab(){
  if (!DB.purchasedItems.length) return '<div class="ds-empty">Nothing purchased yet. Check items off on the Purchase Orders tab and they\u2019ll show up here.</div>';

  var vendorGroups = {};
  DB.purchasedItems.forEach(function(p){
    (vendorGroups[p.vendorId] = vendorGroups[p.vendorId] || []).push(p);
  });
  var vendorIds = Object.keys(vendorGroups).sort(function(a,b){
    var va = vendorById(a), vb = vendorById(b);
    return (va?va.name:"").localeCompare(vb?vb.name:"");
  });

  var grandTotal = DB.purchasedItems.reduce(function(s,p){return s+p.qty*p.price;},0);
  var html = '<div class="ds-card" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">';
  html += '<div style="font-size:13px;color:#5b6b80;">'+DB.purchasedItems.length+' item'+(DB.purchasedItems.length===1?"":"s")+' purchased across '+vendorIds.length+' supplier'+(vendorIds.length===1?"":"s")+'</div>';
  html += '<div style="font-size:17px;font-weight:700;color:#13233a;">Total: '+fmt$(grandTotal)+'</div>';
  html += '</div>';

  vendorIds.forEach(function(vid){
    var v = vendorById(vid);
    var items = vendorGroups[vid];

    /* Items from the same original order, checked off on the same day,
       are grouped into one order block. */
    var orderGroups = {};
    items.forEach(function(p){
      var key = p.orderNumber + "|" + p.purchasedDate;
      if (!orderGroups[key]) orderGroups[key] = { orderNumber: p.orderNumber, purchasedDate: p.purchasedDate, items: [] };
      orderGroups[key].items.push(p);
    });
    var orderKeys = Object.keys(orderGroups).sort(function(a,b){
      return (orderGroups[b].purchasedDate||"").localeCompare(orderGroups[a].purchasedDate||"");
    });
    var vendorTotal = items.reduce(function(s,p){return s+p.qty*p.price;},0);

    html += '<div class="ds-card">';
    html += '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;">';
    html += '<div class="ds-card-title" style="margin-bottom:0;">'+escapeHtml(v?v.name:"Unknown vendor")+'</div>';
    html += '<div style="font-size:11.5px;color:#7c8a9b;">'+items.length+' item'+(items.length===1?"":"s")+' \u00b7 '+orderKeys.length+' order'+(orderKeys.length===1?"":"s")+'</div>';
    html += '</div>';

    orderKeys.forEach(function(key, idx){
      var grp = orderGroups[key];
      var subtotal = grp.items.reduce(function(s,p){return s+p.qty*p.price;},0);
      html += '<div style="margin-top:'+(idx===0?"10px":"16px")+';padding-top:'+(idx===0?"0":"14px")+';'+(idx===0?"":"border-top:1px solid #eef1f4;")+'">';
      html += '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px;">';
      html += '<div style="font-size:12.5px;font-weight:700;color:#13233a;">Order #'+grp.orderNumber+'</div>';
      html += '<label style="font-size:11px;color:#7c8a9b;">Purchased <input type="date" data-group-order="'+grp.orderNumber+'" data-group-olddate="'+escapeAttr(grp.purchasedDate||"")+'" value="'+escapeAttr(grp.purchasedDate||"")+'" style="width:140px;" /></label>';
      html += '</div>';
      html += '<div style="overflow-x:auto;"><table class="ds-table"><tr><th>Qty</th><th>Item</th><th>Total price paid</th><th></th><th>Received</th></tr>';
      grp.items.forEach(function(p){
        html += '<tr>';
        html += '<td>'+p.qty+'</td>';
        html += '<td><div class="ds-item-name">'+escapeHtml(p.itemName)+'</div></td>';
        html += '<td>'+fmt$(p.qty*p.price)+'</td>';
        html += '<td><button data-action="remove-purchased-item" data-id="'+p.id+'" aria-label="Remove this purchased record" style="padding:4px 9px;background:#fff;border:1px solid #d8dee5;border-radius:6px;"><span aria-hidden="true" style="font-size:15px;font-weight:700;color:#b3261e;line-height:1;">\u00d7</span></button></td>';
        html += '<td style="text-align:center;"><input type="checkbox" data-action="toggle-item-received" data-id="'+p.id+'" aria-label="Mark '+escapeAttr(p.itemName)+' as received" style="width:17px;height:17px;accent-color:#1b62c4;" /></td>';
        html += '</tr>';
      });
      html += '</table></div>';
      html += '<div style="text-align:right;font-size:12.5px;color:#5b6b80;margin-top:6px;">Order subtotal: '+fmt$(subtotal)+'</div>';
      html += '</div>';
    });

    html += '<div style="text-align:right;font-size:13px;font-weight:700;color:#13233a;margin-top:14px;padding-top:10px;border-top:1px solid #e3e7ec;">Supplier total: '+fmt$(vendorTotal)+'</div>';
    html += '</div>';
  });
  return html;
}

    html += '<div class="ds-empty">'+(DB.receivedItems.length ? "No received items match this filter." : "No orders received yet.")+'</div>';

  var vendorGroups = {};
  list.forEach(function(r){ (vendorGroups[r.vendorId] = vendorGroups[r.vendorId] || []).push(r); });
  var vendorIds = Object.keys(vendorGroups).sort(function(a,b){
    var va = vendorById(a), vb = vendorById(b);
    return (va?va.name:"").localeCompare(vb?vb.name:"");
  });

  vendorIds.forEach(function(vid){
    var v = vendorById(vid);
    var items = vendorGroups[vid];
    var orderGroups = {};
    items.forEach(function(r){
      var key = r.orderNumber + "|" + r.purchasedDate;

      orderGroups[key].items.push(r);
    });
    var orderKeys = Object.keys(orderGroups).sort(function(a,b){
      return (orderGroups[b].purchasedDate||"").localeCompare(orderGroups[a].purchasedDate||"");
    });
    var vendorTotal = items.reduce(function(s,r){return s+r.qty*r.price;},0);

    html += '<div class="ds-card">';
    html += '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;">';
    html += '<div class="ds-card-title" style="margin-bottom:0;">'+escapeHtml(v?v.name:"Unknown vendor")+'</div>';
    html += '<div style="font-size:11.5px;color:#7c8a9b;">'+items.length+' item'+(items.length===1?"":"s")+' \u00b7 '+orderKeys.length+' order'+(orderKeys.length===1?"":"s")+'</div>';
    html += '</div>';

    orderKeys.forEach(function(key, idx){
      var grp = orderGroups[key];
      var subtotal = grp.items.reduce(function(s,r){return s+r.qty*r.price;},0);
      html += '<div style="margin-top:'+(idx===0?"10px":"16px")+';padding-top:'+(idx===0?"0":"14px")+';'+(idx===0?"":"border-top:1px solid #eef1f4;")+'">';
      html += '<div style="font-size:12.5px;font-weight:700;color:#13233a;margin-bottom:6px;">Order #'+grp.orderNumber+' \u00b7 purchased '+fmtDate(grp.purchasedDate)+'</div>';
      html += '<div style="overflow-x:auto;"><table class="ds-table"><tr><th>Order #</th><th>Qty</th><th>Item</th><th>Total paid</th><th>Received</th><th></th></tr>';
      grp.items.forEach(function(r){
        html += '<tr><td>#'+r.orderNumber+'</td><td>'+r.qty+'</td><td><div class="ds-item-name">'+escapeHtml(r.itemName)+'</div></td><td>'+fmt$(r.qty*r.price)+'</td><td>'+fmtDate(r.receivedDate)+'</td>';
        html += '<td><button class="ds-undo-link" data-action="undo-received" data-id="'+r.id+'">Undo</button></td></tr>';
      });
      html += '</table></div>';

      html += '</div>';

    html += '<div style="text-align:right;font-size:13px;font-weight:700;color:#13233a;margin-top:14px;padding-top:10px;border-top:1px solid #e3e7ec;">Supplier total: '+fmt$(vendorTotal)+'</div>';
    html += '</div>';
  });
  return html;
}

function closeModal(){
  var el = document.getElementById("ds-modal-overlay");
  if (el) el.remove();
}
function triggerDownload(jsonStr){
  try{
    var blob = new Blob([jsonStr], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "got-signs-inventory-backup-"+todayStr()+".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }catch(e){ /* ignored \u2014 the modal below is the reliable fallback */ }
}
function exportData(){
  var payload = {
    exportedAt: todayStr(),
    orderCounter: lsGet("orderCounter", 1000),
    items: DB.items,
    vendors: DB.vendors,
    itemVendors: DB.itemVendors,
    pos: DB.pos,
    poLines: DB.poLines,
    purchasedItems: DB.purchasedItems,
    receivedItems: DB.receivedItems
  };
  var jsonStr = JSON.stringify(payload, null, 2);
  triggerDownload(jsonStr);

  closeModal();
  var overlay = document.createElement("div");
  overlay.id = "ds-modal-overlay";
  overlay.className = "ds-modal-overlay";
  overlay.innerHTML =
    '<div class="ds-modal">' +
      '<h2>Export data</h2>' +
      '<p>A download may have already started. If nothing happened (common when previewing in a sandboxed view), copy the text below and save it yourself as a <b>.json</b> file, or try the download button again.</p>' +
      '<textarea readonly id="ds-export-text"></textarea>' +
      '<div class="ds-modal-actions">' +
        '<button class="ds-btn-outline" data-action="modal-close">Close</button>' +
        '<button class="ds-btn-outline" data-action="modal-copy">Copy to clipboard</button>' +
        '<button class="ds-btn-primary" data-action="modal-download">Download .json file</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(overlay);
  document.getElementById("ds-export-text").value = jsonStr;
  overlay.querySelector('[data-action="modal-close"]').addEventListener("click", closeModal);
  overlay.querySelector('[data-action="modal-copy"]').addEventListener("click", function(){
    var ta = document.getElementById("ds-export-text");
    ta.focus(); ta.select();
    try{
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(jsonStr);
      else document.execCommand("copy");
      alert("Copied to clipboard.");
    }catch(e){ alert("Couldn't copy automatically \u2014 the text is already selected, so you can copy it manually (Ctrl/Cmd+C)."); }
  });
  overlay.querySelector('[data-action="modal-download"]').addEventListener("click", function(){ triggerDownload(jsonStr); });
  overlay.addEventListener("click", function(e){ if (e.target===overlay) closeModal(); });
}

function importDataFromText(text){
  var data;
  try{ data = JSON.parse(text); }
  catch(err){ alert("Couldn't read that \u2014 make sure it's a full Got Signs backup (the exact text from Export data)."); return; }
  if (!data || !Array.isArray(data.items) || !Array.isArray(data.vendors)){
    alert("That doesn't look like a valid Got Signs backup.");
    return;
  }
  if (!confirm("Import this backup? This will replace all current data in this browser.")) return;
  DB.items = data.items || [];
  DB.vendors = data.vendors || [];
  DB.itemVendors = data.itemVendors || [];
  DB.pos = data.pos || [];
  DB.poLines = data.poLines || [];
  DB.purchasedItems = data.purchasedItems || [];
  DB.receivedItems = data.receivedItems || [];
  persist("items"); persist("vendors"); persist("itemVendors"); persist("pos"); persist("poLines"); persist("purchasedItems"); persist("receivedItems");
  lsSet("orderCounter", data.orderCounter || 1000);
  lsSet("seeded_v1", true);
  backfillOrderData();
  closeModal();
  state.tab = "dashboard";
  render();
  alert("Backup imported.");
}
function showImportModal(){
  closeModal();
  var overlay = document.createElement("div");
  overlay.id = "ds-modal-overlay";
  overlay.className = "ds-modal-overlay";
  overlay.innerHTML =
    '<div class="ds-modal">' +
      '<h2>Import data</h2>' +
      '<p>Paste a previously exported backup below, or choose the .json file if your browser supports it.</p>' +
      '<textarea id="ds-import-text" placeholder="Paste exported backup JSON here\u2026"></textarea>' +
      '<div class="ds-modal-actions">' +
        '<button class="ds-btn-outline" data-action="modal-close">Close</button>' +
        '<button class="ds-btn-outline" data-action="modal-choose-file">Choose file\u2026</button>' +
        '<button class="ds-btn-primary" data-action="modal-restore">Restore</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(overlay);
  overlay.querySelector('[data-action="modal-close"]').addEventListener("click", closeModal);
  overlay.querySelector('[data-action="modal-choose-file"]').addEventListener("click", function(){
    var fileInput = document.createElement("input");
    fileInput.type = "file";
    fileInput.accept = "application/json";
    fileInput.addEventListener("change", function(){
      if (fileInput.files && fileInput.files[0]){
        var reader = new FileReader();
        reader.onload = function(e){ document.getElementById("ds-import-text").value = e.target.result; };
        reader.readAsText(fileInput.files[0]);
      }
    });
    fileInput.click();
  });
  overlay.querySelector('[data-action="modal-restore"]').addEventListener("click", function(){
    importDataFromText(document.getElementById("ds-import-text").value);
  });
  overlay.addEventListener("click", function(e){ if (e.target===overlay) closeModal(); });
}

/* ============================================================
   MONTHLY BUDGET TAB
   ============================================================ */
var MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function monthKeyForOffset(offset){
  var d = new Date();
  d.setDate(1);
  d.setMonth(d.getMonth()+offset);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
}
function monthLabelForKey(key){
  var parts = key.split("-");
  return MONTH_NAMES[parseInt(parts[1],10)-1] + " " + parts[0];
}
function computeMonthSpend(monthKey){
  var entries = [];
  DB.purchasedItems.forEach(function(p){ if ((p.purchasedDate||"").slice(0,7)===monthKey) entries.push(p); });
  DB.receivedItems.forEach(function(r){ if ((r.purchasedDate||"").slice(0,7)===monthKey) entries.push(r); });

  var byCategory = {};
  CATEGORY_ORDER.forEach(function(c){ byCategory[c] = {qty:0, total:0}; });
  var grandTotal = 0;
  entries.forEach(function(e){
    var it = itemById(e.itemId);
    var subtotal = e.qty*e.price;
    grandTotal += subtotal;
    var cat = it ? it.category : null;
    if (cat && byCategory[cat]){ byCategory[cat].qty += e.qty; byCategory[cat].total += subtotal; }
  });

  var orderGroups = {};
  entries.forEach(function(e){
    var key = e.orderNumber+"|"+e.purchasedDate;
    if (!orderGroups[key]) orderGroups[key] = { orderNumber: e.orderNumber, vendorId: e.vendorId, purchasedDate: e.purchasedDate, total: 0 };
    orderGroups[key].total += e.qty*e.price;
  });
  var orders = Object.keys(orderGroups).map(function(k){ return orderGroups[k]; });

  return { entries: entries, orders: orders, byCategory: byCategory, grandTotal: grandTotal };
}
function budgetTab(){
  var monthKey = monthKeyForOffset(state.budgetMonthOffset);
  var label = monthLabelForKey(monthKey);
  var data = computeMonthSpend(monthKey);
  var budgetTarget = parseFloat(lsGet("monthlyBudgetTarget", 0)) || 0;

  var html = '<div style="display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:1.25rem;">';
  html += '<button class="ds-btn-outline" data-action="budget-prev-month" aria-label="Previous month"><i class="ti ti-chevron-left" style="font-size:14px;" aria-hidden="true"></i></button>';
  html += '<div style="font-size:17px;font-weight:700;color:#13233a;min-width:170px;text-align:center;">'+label+'</div>';
  html += '<button class="ds-btn-outline" data-action="budget-next-month" aria-label="Next month" '+(state.budgetMonthOffset>=0?'disabled style="opacity:.4;"':'')+'><i class="ti ti-chevron-right" style="font-size:14px;" aria-hidden="true"></i></button>';
  html += '</div>';

  html += '<div class="ds-card" style="text-align:center;">';

  html += '<div style="font-size:34px;font-weight:800;color:#13233a;">'+fmt$(data.grandTotal)+'</div>';
  if (budgetTarget>0){
    var pct = Math.min(100, (data.grandTotal/budgetTarget)*100);
    var over = data.grandTotal>budgetTarget;
    var barColor = over ? "#d9453c" : (pct>85 ? "#f2b33d" : "#2f9757");
    html += '<div style="height:10px;background:#eef1f4;border-radius:6px;overflow:hidden;margin:14px auto 8px;max-width:340px;"><div style="height:100%;width:'+pct+'%;background:'+barColor+';"></div></div>';
    html += '<div style="font-size:12.5px;color:'+(over?'#b3261e':'#5b6b80')+';">' + (over
      ? fmt$(data.grandTotal-budgetTarget)+' over your '+fmt$(budgetTarget)+' budget'

  }
  html += '<div style="margin-top:14px;display:flex;align-items:center;justify-content:center;gap:8px;">';

  html += '</div>';
  html += '</div>';

  if (!data.entries.length){
    html += '<div class="ds-empty">No purchases recorded for '+label+' yet.</div>';
    return html;
  }

  html += '<div class="ds-card"><div class="ds-card-title">Spending by category</div>';
  CATEGORY_ORDER.forEach(function(key){
    var c = data.byCategory[key];

    html += '<button type="button" data-action="toggle-budget-category" data-category="'+key+'" style="all:unset;cursor:pointer;display:block;width:100%;box-sizing:border-box;" aria-expanded="'+(isOpen?"true":"false")+'">';
    html += '<div style="display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;margin-bottom:4px;"><span style="color:#13233a;font-weight:600;">'+(c.qty>0?'<i class="ti '+(isOpen?"ti-chevron-down":"ti-chevron-right")+'" style="font-size:12px;vertical-align:-1px;margin-right:3px;color:#7c8a9b;" aria-hidden="true"></i>':'')+c.qty+' '+CATEGORY_LABELS[key].toLowerCase()+' ordered</span><span style="font-weight:700;color:#13233a;">'+fmt$(c.total)+'</span></div>';
    html += '<div style="height:8px;background:#eef1f4;border-radius:5px;overflow:hidden;"><div style="height:100%;width:'+pct+'%;background:#1b62c4;"></div></div>';
    html += '</button>';
    if (isOpen && c.qty>0){
      var catEntries = data.entries.filter(function(e){ var it = itemById(e.itemId); return it && it.category===key; });
      html += '<div style="overflow-x:auto;margin-top:8px;"><table class="ds-table"><tr><th>Item</th><th>Qty</th><th>Price</th><th>Total</th><th>Vendor</th><th>Date</th></tr>';
      catEntries.sort(function(a,b){return (b.purchasedDate||"").localeCompare(a.purchasedDate||"");}).forEach(function(e){
        var v = vendorById(e.vendorId);
        html += '<tr><td><div class="ds-item-name">'+escapeHtml(e.itemName)+'</div></td><td>'+e.qty+'</td><td>'+fmt$(e.price)+'</td><td>'+fmt$(e.qty*e.price)+'</td><td>'+escapeHtml(v?v.name:"Unknown")+'</td><td>'+fmtDate(e.purchasedDate)+'</td></tr>';
      });
      html += '</table></div>';
    }
    html += '</div>';
  });
  html += '</div>';

  html += '<div class="ds-card"><div class="ds-card-title">Orders this month</div>';
  html += '<div style="overflow-x:auto;"><table class="ds-table"><tr><th>Order</th><th>Vendor</th><th>Purchased</th><th>Total</th></tr>';
  data.orders.slice().sort(function(a,b){return (a.purchasedDate||"").localeCompare(b.purchasedDate||"");}).forEach(function(g){
    var v = vendorById(g.vendorId);
    var orderKey = g.orderNumber + "|" + g.purchasedDate;
    var isOpen = !!state.budgetExpandedOrders[orderKey];
    html += '<tr class="ds-clickable-row" data-action="toggle-budget-order" data-order-number="'+g.orderNumber+'" data-order-date="'+escapeAttr(g.purchasedDate)+'">';
    html += '<td><i class="ti '+(isOpen?"ti-chevron-down":"ti-chevron-right")+'" style="font-size:12px;vertical-align:-1px;margin-right:4px;color:#7c8a9b;" aria-hidden="true"></i>#'+g.orderNumber+'</td>';
    html += '<td>'+escapeHtml(v?v.name:"Unknown")+'</td><td>'+fmtDate(g.purchasedDate)+'</td><td>'+fmt$(g.total)+'</td></tr>';
    if (isOpen){
      var orderEntries = data.entries.filter(function(e){ return e.orderNumber===g.orderNumber && e.purchasedDate===g.purchasedDate; });
      html += '<tr><td colspan="4" style="padding:0 0 10px;background:#f8fafb;">';
      html += '<table class="ds-table" style="margin:0 0 0 20px;width:calc(100% - 20px);"><tr><th>Item</th><th>Qty</th><th>Price</th><th>Total</th></tr>';
      orderEntries.forEach(function(e){
        html += '<tr><td><div class="ds-item-name">'+escapeHtml(e.itemName)+'</div></td><td>'+e.qty+'</td><td>'+fmt$(e.price)+'</td><td>'+fmt$(e.qty*e.price)+'</td></tr>';
      });
      html += '</table></td></tr>';
    }
  });
  html += '</table></div></div>';

  return html;
}

/* ============================================================
   EVENT BINDING
   ============================================================ */
function bindEvents(){
  var root = document.getElementById("ds-root");

  if (state.tab==="dashboard"){
    root.querySelectorAll('[data-action="status-filter"]').forEach(function(b){
      b.addEventListener("click", function(){
        state.statusFilter = b.getAttribute("data-status");
        state.freqFilter = "all";
        state.tab = "frequency";
        render();
      });
    });
    root.querySelectorAll('[data-action="open-category"]').forEach(function(b){
      b.addEventListener("click", function(){
        var key = b.getAttribute("data-category");
        b.classList.add("flipping-out");
        var done = false;
        function go(){ if (done) return; done = true; state.categoryKey = key; state.tab = "category"; render(); }
        b.addEventListener("transitionend", go, {once:true});
        setTimeout(go, 260);
      });
    });
    var gotoMissing = root.querySelector('[data-action="goto-missing"]');
    if (gotoMissing) gotoMissing.addEventListener("click", function(e){ e.preventDefault(); state.tab="missingItems"; render(); });
    var gotoCatalog = root.querySelector('[data-action="goto-catalog"]');
    if (gotoCatalog) gotoCatalog.addEventListener("click", function(){ state.tab="catalog"; render(); });
    var exportBtn = root.querySelector('[data-action="export-data"]');
    if (exportBtn) exportBtn.addEventListener("click", exportData);
    var triggerImport = root.querySelector('[data-action="trigger-import"]');
    if (triggerImport) triggerImport.addEventListener("click", showImportModal);
  }

  if (state.tab==="category"){
    var back = root.querySelector('[data-action="back-to-dashboard"]');
    if (back) back.addEventListener("click", function(){ state.tab="dashboard"; render(); });
  }

  if (state.tab==="frequency"){
    root.querySelectorAll("[data-freqtab]").forEach(function(b){
      b.addEventListener("click", function(){ state.freqFilter = b.getAttribute("data-freqtab"); render(); });
    });
    root.querySelectorAll("[data-ilcat]").forEach(function(b){
      b.addEventListener("click", function(){ state.itemsListCategory = b.getAttribute("data-ilcat"); render(); });
    });
    root.querySelectorAll("[data-statustab]").forEach(function(b){
      b.addEventListener("click", function(){
        var v = b.getAttribute("data-statustab");
        state.statusFilter = (v==="all") ? null : v;
        render();
      });
    });
    var ilSearch = root.querySelector("[data-il-search]");
    if (ilSearch) ilSearch.addEventListener("input", function(){
      state.search = ilSearch.value;
      renderMain();
      var main = document.getElementById("ds-main");
      var inp = main.querySelector("[data-il-search]");
      if (inp){ inp.focus(); var v=inp.value; inp.value=""; inp.value=v; }
    });
    var addListItem = root.querySelector('[data-action="add-list-item"]');
    if (addListItem) addListItem.addEventListener("click", function(){
      var name = prompt("Item name:");
      if (!name) return;
      DB.items.push({id: uid("i"), name:name, unit:"each", tier:"weekly", par:1, reorder:0, qty:0, category:"vinyl"});
      persist("items"); render();
    });
    root.querySelectorAll('[data-il-field]').forEach(function(el){
      el.addEventListener("change", function(){
        var it = itemById(el.getAttribute("data-il-item"));
        if (!it) return;
        var f = el.getAttribute("data-il-field");
        if (f==="qty" || f==="reorder" || f==="par") it[f] = Math.max(0, parseInt(el.value||"0",10));
        else it[f] = el.value;
        persist("items"); render();
      });
    });
    root.querySelectorAll('[data-action="remove-list-item"]').forEach(function(b){
      b.addEventListener("click", function(){
        var id = b.getAttribute("data-item");
        if (!confirm("Remove this item from the catalog?")) return;
        DB.items = DB.items.filter(function(i){return i.id!==id;});
        DB.itemVendors = DB.itemVendors.filter(function(iv){return iv.itemId!==id;});
        persist("items"); persist("itemVendors"); render();
      });
    });
  }

  if (state.tab==="catalog"){
    root.querySelectorAll("[data-catalogtab]").forEach(function(b){
      b.addEventListener("click", function(){ state.catalogTab = b.getAttribute("data-catalogtab"); render(); });
    });
    root.querySelectorAll("[data-catalogfreq]").forEach(function(b){
      b.addEventListener("click", function(){ state.catalogFreq = b.getAttribute("data-catalogfreq"); render(); });
    });
    var searchInp = root.querySelector("[data-catalog-search]");
    if (searchInp) searchInp.addEventListener("input", function(){
      state.search = searchInp.value;
      renderMain();
      var main = document.getElementById("ds-main");
      var inp = main.querySelector("[data-catalog-search]");
      if (inp){ inp.focus(); var v=inp.value; inp.value=""; inp.value=v; }
    });
    root.querySelectorAll("[data-qty]").forEach(function(inp){
      inp.addEventListener("change", function(){
        var it = itemById(inp.getAttribute("data-qty"));
        if (it){ it.qty = Math.max(0, parseInt(inp.value||"0",10)); persist("items"); lsSet("lastInventoryDate", todayStr()); }
      });
    });
    root.querySelectorAll("[data-ideal]").forEach(function(inp){
      inp.addEventListener("change", function(){
        var it = itemById(inp.getAttribute("data-ideal"));
        if (it){ it.par = Math.max(0, parseInt(inp.value||"0",10)); persist("items"); }
      });
    });
  }

  if (state.tab==="purchaseOrders"){
    root.querySelectorAll('[data-action="cancel-po"]').forEach(function(b){
      b.addEventListener("click", function(){ cancelCreatedPO(b.getAttribute("data-poid")); });
    });

    root.querySelectorAll('[data-action="edit-po-field"]').forEach(function(el){
      function activate(){
        var field = el.getAttribute("data-field"), id = el.getAttribute("data-id");
        state.poEditing = {field: field, id: id};
        renderMain();
        var sel = field==="qty" ? '[data-line-qty="'+id+'"]' : field==="price" ? '[data-line-price="'+id+'"]' : field==="vendor" ? '[data-line-vendor="'+id+'"]' : '[data-vendor-contact="'+id+'"]';
        var target = document.querySelector(sel);
        if (target){ target.focus(); if (target.select) target.select(); }
      }
      el.addEventListener("click", activate);
      el.addEventListener("keydown", function(e){ if (e.key==="Enter" || e.key===" "){ e.preventDefault(); activate(); } });
    });

    root.querySelectorAll('[data-line-qty]').forEach(function(inp){
      inp.addEventListener("change", function(){
        var line = DB.poLines.find(function(l){return l.id===inp.getAttribute("data-line-qty");});
        if (line) line.qty = Math.max(1, parseInt(inp.value||"1",10));
        persist("poLines"); state.poEditing = null; renderMain();
      });
      inp.addEventListener("blur", function(){
        if (isEditingPO("qty", inp.getAttribute("data-line-qty"))){ state.poEditing = null; renderMain(); }
      });
    });
    root.querySelectorAll('[data-line-price]').forEach(function(inp){
      inp.addEventListener("change", function(){
        var line = DB.poLines.find(function(l){return l.id===inp.getAttribute("data-line-price");});
        if (line){
          var newPrice = Math.max(0, parseFloat(inp.value||"0"));
          line.price = newPrice;
          var linePO = poById(line.poId);
          if (linePO) updateVendorPriceForLine(line.itemId, linePO.vendorId, newPrice);
        }
        persist("poLines"); state.poEditing = null; renderMain();
      });
      inp.addEventListener("blur", function(){
        if (isEditingPO("price", inp.getAttribute("data-line-price"))){ state.poEditing = null; renderMain(); }
      });
    });
    root.querySelectorAll('[data-line-vendor]').forEach(function(sel){
      sel.addEventListener("change", function(){
        var lineId = sel.getAttribute("data-line-vendor");
        state.poEditing = null;
        if (sel.value==="__other__"){
          var name = prompt("New supplier name:");
          if (name) addNewVendorAndMoveLine(lineId, name);
          else render();
        } else {
          moveLineToVendor(lineId, sel.value);
        }
      });
      sel.addEventListener("blur", function(){
        if (isEditingPO("vendor", sel.getAttribute("data-line-vendor"))){ state.poEditing = null; renderMain(); }
      });
    });
    root.querySelectorAll('[data-action="remove-po-line"]').forEach(function(b){
      b.addEventListener("click", function(){ removePOLine(b.getAttribute("data-lineid")); });
    });
    root.querySelectorAll('[data-action="toggle-line-purchased"]').forEach(function(cb){
      cb.addEventListener("change", function(){
        if (cb.checked) markLinePurchased(cb.getAttribute("data-lineid"));
      });
    });
    root.querySelectorAll('[data-vendor-contact]').forEach(function(inp){
      inp.addEventListener("change", function(){
        updateVendorContact(inp.getAttribute("data-vendor-contact"), inp.value);
        state.poEditing = null; renderMain();
      });
      inp.addEventListener("blur", function(){
        if (isEditingPO("phone", inp.getAttribute("data-vendor-contact"))){ state.poEditing = null; renderMain(); }
      });
    });
  }

  if (state.tab==="pendingOrders"){
    root.querySelectorAll('[data-group-order]').forEach(function(inp){
      inp.addEventListener("change", function(){
        var orderNumber = parseInt(inp.getAttribute("data-group-order"),10);
        var oldDate = inp.getAttribute("data-group-olddate");
        updatePurchasedDateGroup(orderNumber, oldDate, inp.value);
      });
    });
    root.querySelectorAll('[data-action="remove-purchased-item"]').forEach(function(b){
      b.addEventListener("click", function(){ removePurchasedItem(b.getAttribute("data-id")); });
    });
    root.querySelectorAll('[data-action="toggle-item-received"]').forEach(function(cb){
      cb.addEventListener("change", function(){ if (cb.checked) markItemReceived(cb.getAttribute("data-id")); });
    });
  }

  if (state.tab==="ordersReceived"){
    root.querySelectorAll('[data-action="undo-received"]').forEach(function(b){
      b.addEventListener("click", function(){ undoItemReceived(b.getAttribute("data-id")); });
    });
    root.querySelectorAll("[data-historyrange]").forEach(function(b){
      b.addEventListener("click", function(){ state.historyDateRange = b.getAttribute("data-historyrange"); render(); });
    });
    root.querySelectorAll("[data-historycat]").forEach(function(b){
      b.addEventListener("click", function(){ state.historyCategory = b.getAttribute("data-historycat"); render(); });
    });
    var supplierSel = root.querySelector("[data-historysupplier]");
    if (supplierSel) supplierSel.addEventListener("change", function(){ state.historySupplier = supplierSel.value; render(); });
  }

  if (state.tab==="missingItems"){
    root.querySelectorAll('[data-action="resolve-missing"]').forEach(function(b){
      b.addEventListener("click", function(){ markItemReceived(b.getAttribute("data-id")); });
    });
    root.querySelectorAll('[data-vendor-contact]').forEach(function(inp){
      inp.addEventListener("change", function(){ updateVendorContact(inp.getAttribute("data-vendor-contact"), inp.value); });
    });
  }

  if (state.tab==="suppliers"){
    var addSupplier = root.querySelector('[data-action="add-supplier"]');
    if (addSupplier) addSupplier.addEventListener("click", function(){
      var name = prompt("Supplier name:");
      if (!name) return;
      DB.vendors.push({id: uid("v"), name:name, website:"", contact:"", contactName:""});
      persist("vendors"); render();
    });
    root.querySelectorAll('[data-supplier-field]').forEach(function(inp){
      inp.addEventListener("change", function(){
        var v = vendorById(inp.getAttribute("data-supplier"));
        if (v){ v[inp.getAttribute("data-supplier-field")] = inp.value; persist("vendors"); render(); }
      });
    });
    root.querySelectorAll('[data-action="remove-supplier"]').forEach(function(b){
      b.addEventListener("click", function(){
        var id = b.getAttribute("data-supplier");
        if (!confirm("Remove this supplier? This will also remove their pricing links to items.")) return;
        DB.vendors = DB.vendors.filter(function(v){return v.id!==id;});
        DB.itemVendors = DB.itemVendors.filter(function(iv){return iv.vendorId!==id;});
        persist("vendors"); persist("itemVendors"); render();
      });
    });
  }

  if (state.tab==="budget"){
    var prevMonth = root.querySelector('[data-action="budget-prev-month"]');
    if (prevMonth) prevMonth.addEventListener("click", function(){ state.budgetMonthOffset -= 1; render(); });
    var nextMonth = root.querySelector('[data-action="budget-next-month"]');
    if (nextMonth) nextMonth.addEventListener("click", function(){ if (state.budgetMonthOffset<0){ state.budgetMonthOffset += 1; render(); } });
    var targetInp = root.querySelector('[data-action="set-budget-target"]');
    if (targetInp) targetInp.addEventListener("change", function(){
      lsSet("monthlyBudgetTarget", Math.max(0, parseFloat(targetInp.value||"0")));
      render();
    });
    root.querySelectorAll('[data-action="toggle-budget-category"]').forEach(function(b){
      b.addEventListener("click", function(){
        var key = b.getAttribute("data-category");
        state.budgetExpanded[key] = !state.budgetExpanded[key];
        render();
      });
    });
    root.querySelectorAll('[data-action="toggle-budget-order"]').forEach(function(tr){
      tr.addEventListener("click", function(){
        var key = tr.getAttribute("data-order-number") + "|" + tr.getAttribute("data-order-date");
        state.budgetExpandedOrders[key] = !state.budgetExpandedOrders[key];
        render();
      });
    });
  }
}

/* ---------------- boot ---------------- */
loadDB();
syncPurchaseOrders();
render();
if (!storageWorks) showSaveWarning();

})();
</script>
